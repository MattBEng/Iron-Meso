:root{
  --brand-cream:#FFF0E0; --brand-coral:#FF7A6E;
  --bg:#0B0E14; --surface:#131926; --raised:#1B2333; --line:#242E42;
  --accent:#FF6B35;
  --accent-soft:rgba(255,107,53,.14);
  --cyan:#53DDD0; --green:#3ECF8E; --amber:#FFC24B; --red:#FF5C7A;
  --text:#EAF0F7; --muted:#8794A8; --faint:#5A6579;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --rir0:#FF5C7A; --rir1:#FF8A5C; --rir2:#FFC24B; --rir3:#8BD46B; --rir4:#3ECF8E;
  --tap:52px;
}
[data-theme="light"]{
  /* Clean neutral canvas with the coral brand accent (not a peach wash) */
  --bg:#F2F4F8; --surface:#FFFFFF; --raised:#FFFFFF; --line:#DDE3EC;
  --accent:#FF7A6E; --accent-soft:rgba(255,122,110,.14);
  --text:#141A26; --muted:#5B667A; --faint:#93A0B5;
  --shadow:0 6px 20px rgba(20,30,50,.10);
  --cyan:#20B2A6; --green:#2FB574; --amber:#E0982A; --red:#E85472;
}
[data-theme="dark"]{
  /* Consistent dark: coral accent to match the brand, same surfaces */
  --accent:#FF7A6E; --accent-soft:rgba(255,122,110,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  min-height:100vh;
}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.02em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
input,select,textarea{
  font:inherit; color:var(--text); background:var(--bg);
  border:1px solid var(--line); border-radius:var(--r-sm);
  padding:12px 14px; width:100%; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; display:block; margin:14px 0 6px}
.app{max-width:560px; margin:0 auto; padding:18px 16px 30px}
@media(min-width:900px){ .app{max-width:640px} }

/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
.brand{font-family:"Baloo2",-apple-system,sans-serif; font-size:26px; font-weight:800; letter-spacing:0;
  color:var(--brand-coral); line-height:1}
.brand em{font-style:normal; color:var(--brand-coral)}
.top-sub{font-size:12px; color:var(--muted); font-weight:600}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow)}
.card h3{margin-bottom:10px}
.card .kicker{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
.row{display:flex; gap:10px; align-items:center}
.row.split{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:10px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.muted{color:var(--muted); font-size:13px}
.faint{color:var(--faint); font-size:12px}
.spacer{flex:1}
hr{border:0; border-top:1px solid var(--line); margin:14px 0}

/* buttons */
.btn{display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:0 18px; border-radius:var(--r-md);
  font-weight:800; font-size:16px; transition:transform .08s ease, filter .15s;
  user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent); color:#14100C}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--raised); border:1px solid var(--line)}
.btn-danger{background:rgba(255,92,122,.12); color:var(--red); border:1px solid rgba(255,92,122,.35)}
.btn-sm{min-height:38px; font-size:14px; padding:0 12px; border-radius:var(--r-sm)}
.btn-block{width:100%}
.iconbtn{width:38px; height:38px; min-height:38px; padding:0; border-radius:var(--r-sm);
  background:var(--raised); border:1px solid var(--line); font-size:16px; font-weight:800}

/* chips / pills */
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
  font-size:12px; font-weight:700; background:var(--raised); border:1px solid var(--line); color:var(--muted)}
.pill.acc{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.pill.grn{background:rgba(62,207,142,.13); color:var(--green); border-color:transparent}
.pill.red{background:rgba(255,92,122,.13); color:var(--red); border-color:transparent}
.pill.amb{background:rgba(255,194,75,.13); color:var(--amber); border-color:transparent}

/* bottom nav */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(14px); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:700; color:var(--faint); padding:6px 6px; border-radius:12px; min-width:44px}
.nav button.active{color:var(--accent); background:var(--accent-soft)}
.nav .ic{font-size:20px; line-height:1}

/* workout screen */
.wk-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px}
.wk-exname{font-size:24px; font-weight:900; letter-spacing:-.02em}
.wk-target{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px}
.suggest{background:linear-gradient(135deg, var(--accent-soft), transparent);
  border:1px solid rgba(255,107,53,.35); border-radius:var(--r-md); padding:14px; margin-bottom:14px}
.suggest .big{font-size:30px; font-weight:900}
.stepper{display:flex; align-items:center; gap:8px; background:var(--raised);
  border:1px solid var(--line); border-radius:var(--r-md); padding:6px}
.stepper button{width:52px; height:52px; border-radius:var(--r-sm); background:var(--surface);
  border:1px solid var(--line); font-size:22px; font-weight:900; flex:0 0 auto}
.stepper .val{flex:1; text-align:center; font-size:26px; font-weight:900}
.stepper .unit{font-size:12px; color:var(--muted); font-weight:700; display:block}
.rirrow{display:flex; gap:8px}
.rirchip{flex:1; min-height:50px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--raised); font-weight:900; font-size:17px; display:flex; align-items:center; justify-content:center}
.rirchip.sel[data-rir="0"]{background:var(--rir0); color:#1c0910; border-color:transparent}
.rirchip.sel[data-rir="1"]{background:var(--rir1); color:#20100a; border-color:transparent}
.rirchip.sel[data-rir="2"]{background:var(--rir2); color:#211705; border-color:transparent}
.rirchip.sel[data-rir="3"]{background:var(--rir3); color:#12200c; border-color:transparent}
.rirchip.sel[data-rir="4"]{background:var(--rir4); color:#0a1f17; border-color:transparent}
.setline{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-sm);
  background:var(--raised); border:1px solid var(--line); font-weight:700}
.setline.done{border-color:rgba(62,207,142,.4)}
.setline .tick{color:var(--green)}
.resttimer{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom));
  z-index:60; background:var(--raised); border:1px solid var(--accent); border-radius:999px;
  padding:10px 20px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow)}
.resttimer .t{font-size:22px; font-weight:900}

/* lists */
.listitem{display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--line); margin-bottom:10px}
.listitem:active{background:var(--raised)}
.listitem .grow{flex:1; min-width:0}
.listitem .title{font-weight:800}
.dragrow{cursor:grab}
.dragrow.dragging{opacity:.4}
.draghandle{color:var(--faint); font-size:18px; padding:4px; cursor:grab}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(4,6,10,.7); z-index:100;
  display:flex; align-items:flex-end; justify-content:center; animation:fade .15s}
@media(min-width:700px){ .modal-bg{align-items:center} }
.modal{background:var(--surface); border:1px solid var(--line); width:100%; max-width:560px;
  border-radius:var(--r-lg) var(--r-lg) 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh; overflow:auto; animation:up .2s ease}
@media(min-width:700px){ .modal{border-radius:var(--r-lg)} }
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h2{margin-bottom:8px}

/* charts */
canvas.chart{width:100%; height:180px; display:block}
.chart-wrap{margin-top:8px}

/* calendar */
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px}
.calgrid .dow{font-size:10px; font-weight:800; color:var(--faint); text-align:center; text-transform:uppercase; padding:2px 0}
.calday{aspect-ratio:1; border-radius:var(--r-sm); background:var(--raised); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:13px; font-weight:700}
.calday.out{opacity:.28}
.calday.today{border-color:var(--accent)}
.calday .dots{display:flex; gap:3px; min-height:6px}
.calday .dot{width:6px; height:6px; border-radius:99px}
.calday:active{background:var(--surface)}

/* toast */
.toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200;
  background:var(--raised); border:1px solid var(--accent); color:var(--text);
  padding:12px 18px; border-radius:var(--r-md); font-weight:800; box-shadow:var(--shadow);
  animation:fade .2s}
.toast.pr{border-color:var(--green); color:var(--green)}

/* misc */
.week-dots{display:flex; gap:6px}
.week-dots .d{width:10px; height:10px; border-radius:99px; background:var(--line)}
.week-dots .d.done{background:var(--accent)}
.week-dots .d.deload{border:1px dashed var(--cyan); background:transparent}
.week-dots .d.cur{outline:2px solid var(--accent); outline-offset:2px}
.searchbar{position:sticky; top:0; z-index:10; background:var(--bg); padding:4px 0 10px}
.empty{color:var(--faint); text-align:center; padding:30px 10px; font-weight:600}
.tag-mg{font-size:11px; font-weight:800; color:var(--cyan); text-transform:uppercase; letter-spacing:.05em}
:root{ --z1:#3ECF8E; --z2:#1D9E75; --z3:#FFC24B; --z4:#FF8A5C; --z5:#FF5C7A }

<script>
"use strict";
/* ================================================================
   LIFT DADDY — single-file bodybuilding mesocycle tracker
   Architecture: StorageManager (persistence) · ProgressionEngine
   (load suggestions) · ChartManager (canvas charts) · App (views)
   All state lives in one serializable object; every mutation calls
   Store.save() (autosave).
   ================================================================ */

/* ---------------- utilities ---------------- */
const $ = (s, el=document)=>el.querySelector(s);
const $$ = (s, el=document)=>[...el.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayISO = ()=>new Date().toISOString().slice(0,10);
const fmtDate = iso=>new Date(iso+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const epley=(w,r)=>r>0? w*(1+r/30):0;

const MUSCLES = ["Cardio","Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Abs","Forearms","Traps"];
const LOWER = new Set(["Quads","Hamstrings","Glutes","Calves"]);
const EQUIP = ["Barbell","Dumbbell","Machine","Cable","Bodyweight","Smith","Kettlebell","Other"];

/* ---------------- starter exercise database ---------------- */
const STARTER_EXERCISES = [
 ["Barbell Bench Press","Chest","Barbell"],["Incline DB Press","Chest","Dumbbell"],
 ["Machine Chest Press","Chest","Machine"],["Cable Fly","Chest","Cable"],["Dips","Chest","Bodyweight"],
 ["Deadlift","Back","Barbell"],["Barbell Row","Back","Barbell"],["Lat Pulldown","Back","Cable"],
 ["Pull-Up","Back","Bodyweight"],["Seated Cable Row","Back","Cable"],["Chest-Supported Row","Back","Machine"],
 ["Overhead Press","Shoulders","Barbell"],["DB Shoulder Press","Shoulders","Dumbbell"],
 ["Lateral Raise","Shoulders","Dumbbell"],["Cable Lateral Raise","Shoulders","Cable"],["Rear Delt Fly","Shoulders","Machine"],
 ["Barbell Curl","Biceps","Barbell"],["DB Curl","Biceps","Dumbbell"],["Hammer Curl","Biceps","Dumbbell"],
 ["Cable Curl","Biceps","Cable"],["Preacher Curl","Biceps","Machine"],
 ["Skullcrusher","Triceps","Barbell"],["Triceps Pushdown","Triceps","Cable"],
 ["Overhead Cable Extension","Triceps","Cable"],["Close-Grip Bench","Triceps","Barbell"],
 ["Back Squat","Quads","Barbell"],["Front Squat","Quads","Barbell"],["Leg Press","Quads","Machine"],
 ["Hack Squat","Quads","Machine"],["Leg Extension","Quads","Machine"],["Bulgarian Split Squat","Quads","Dumbbell"],
 ["Romanian Deadlift","Hamstrings","Barbell"],["Lying Leg Curl","Hamstrings","Machine"],
 ["Seated Leg Curl","Hamstrings","Machine"],["Good Morning","Hamstrings","Barbell"],
 ["Hip Thrust","Glutes","Barbell"],["Cable Kickback","Glutes","Cable"],
 ["Standing Calf Raise","Calves","Machine"],["Seated Calf Raise","Calves","Machine"],
 ["Cable Crunch","Abs","Cable"],["Hanging Leg Raise","Abs","Bodyweight"],["Ab Wheel","Abs","Other"],
 ["Barbell Shrug","Traps","Barbell"],["Wrist Curl","Forearms","Dumbbell"],
 // --- expanded library (RP-style variants) ---
 ["Incline Barbell Press","Chest","Barbell"],["Flat DB Press","Chest","Dumbbell"],
 ["Decline Barbell Press","Chest","Barbell"],["Machine Incline Press","Chest","Machine"],
 ["Smith Bench Press","Chest","Smith"],["Smith Incline Press","Chest","Smith"],
 ["Pec Dec Flye","Chest","Machine"],["DB Flye","Chest","Dumbbell"],["Incline DB Flye","Chest","Dumbbell"],
 ["Cable Incline Flye","Chest","Cable"],["Low-to-High Cable Flye","Chest","Cable"],
 ["Push-Up","Chest","Bodyweight"],["Deficit Push-Up","Chest","Bodyweight"],
 ["Sumo Deadlift","Back","Barbell"],["Snatch-Grip Deadlift","Back","Barbell"],["Rack Pull","Back","Barbell"],
 ["Pendlay Row","Back","Barbell"],["T-Bar Row","Back","Barbell"],["Meadows Row","Back","Barbell"],
 ["One-Arm DB Row","Back","Dumbbell"],["Wide-Grip Cable Row","Back","Cable"],
 ["Neutral-Grip Pulldown","Back","Cable"],["Wide-Grip Pull-Up","Back","Bodyweight"],
 ["Chin-Up","Back","Bodyweight"],["Assisted Pull-Up","Back","Machine"],["Machine Row","Back","Machine"],
 ["Machine Pulldown","Back","Machine"],["Straight-Arm Pulldown","Back","Cable"],["Inverted Row","Back","Bodyweight"],
 ["Seated DB Press","Shoulders","Dumbbell"],["Machine Shoulder Press","Shoulders","Machine"],
 ["Smith Overhead Press","Shoulders","Smith"],["Arnold Press","Shoulders","Dumbbell"],
 ["Cable Lateral Raise (Single-Arm)","Shoulders","Cable"],["Machine Lateral Raise","Shoulders","Machine"],
 ["DB Rear Delt Fly","Shoulders","Dumbbell"],["Cross-Cable Rear Delt Fly","Shoulders","Cable"],
 ["Face Pull","Shoulders","Cable"],["Upright Row","Shoulders","Barbell"],
 ["Plate Front Raise","Shoulders","Other"],["DB Front Raise","Shoulders","Dumbbell"],
 ["Incline DB Curl","Biceps","Dumbbell"],["Spider Curl","Biceps","Dumbbell"],["EZ-Bar Curl","Biceps","Barbell"],
 ["Concentration Curl","Biceps","Dumbbell"],["Bayesian Cable Curl","Biceps","Cable"],
 ["Reverse Curl","Biceps","Barbell"],["Drag Curl","Biceps","Barbell"],["Machine Curl","Biceps","Machine"],
 ["JM Press","Triceps","Barbell"],["Triceps Dip","Triceps","Bodyweight"],
 ["Machine Triceps Extension","Triceps","Machine"],["DB Overhead Extension","Triceps","Dumbbell"],
 ["Single-Arm Pushdown","Triceps","Cable"],["Triceps Kickback","Triceps","Cable"],["Bench Dip","Triceps","Bodyweight"],
 ["Smith Squat","Quads","Smith"],["Pendulum Squat","Quads","Machine"],["Belt Squat","Quads","Machine"],
 ["Goblet Squat","Quads","Dumbbell"],["Sissy Squat","Quads","Bodyweight"],
 ["Walking Lunge","Quads","Dumbbell"],["Reverse Lunge","Quads","Dumbbell"],["Step-Up","Quads","Dumbbell"],
 ["Single-Leg Press","Quads","Machine"],["Leg Press (Narrow Stance)","Quads","Machine"],
 ["Nordic Ham Curl","Hamstrings","Bodyweight"],["Stiff-Leg Deadlift","Hamstrings","Barbell"],
 ["Single-Leg Curl","Hamstrings","Machine"],["45° Back Raise","Hamstrings","Bodyweight"],
 ["DB Romanian Deadlift","Hamstrings","Dumbbell"],
 ["Machine Hip Thrust","Glutes","Machine"],["Smith Hip Thrust","Glutes","Smith"],
 ["Glute Bridge","Glutes","Barbell"],["Hip Abduction Machine","Glutes","Machine"],
 ["Hip Adduction Machine","Glutes","Machine"],["Cable Pull-Through","Glutes","Cable"],
 ["Deficit Reverse Lunge","Glutes","Dumbbell"],
 ["Leg Press Calf Raise","Calves","Machine"],["Smith Calf Raise","Calves","Smith"],
 ["Single-Leg Calf Raise","Calves","Bodyweight"],["Donkey Calf Raise","Calves","Machine"],
 ["Machine Crunch","Abs","Machine"],["Decline Sit-Up","Abs","Bodyweight"],["V-Up","Abs","Bodyweight"],
 ["Reverse Crunch","Abs","Bodyweight"],["Russian Twist","Abs","Other"],["Roman Chair Leg Raise","Abs","Bodyweight"],
 ["Plank","Abs","Bodyweight"],
 ["DB Shrug","Traps","Dumbbell"],["Cable Shrug","Traps","Cable"],["Smith Shrug","Traps","Smith"],
 ["Reverse Wrist Curl","Forearms","Dumbbell"],["Farmer Carry","Forearms","Dumbbell"]
].map(([name,mg,eq])=>({id:"b_"+name.toLowerCase().replace(/[^a-z]+/g,"_"),name,muscle:mg,equipment:eq,notes:"",builtin:true,fav:false}));
// cardio exercises — logged as duration + HR, never counted as lifting volume
const STARTER_CARDIO=[
 ["Treadmill Run","Machine"],["Incline Walk","Machine"],["Outdoor Run","Bodyweight"],
 ["Stationary Bike","Machine"],["Spin Bike","Machine"],["Outdoor Cycle","Bodyweight"],
 ["Rowing Machine","Machine"],["Stair Climber","Machine"],["Elliptical","Machine"],
 ["Swimming","Bodyweight"],["Jump Rope","Other"],["Assault Bike","Machine"]
].map(([name,eq])=>({id:"c_"+name.toLowerCase().replace(/[^a-z]+/g,"_"),name,muscle:"Cardio",equipment:eq,notes:"",builtin:true,fav:false,cardio:true}));
STARTER_EXERCISES.push(...STARTER_CARDIO);

/* ---------------- storage ---------------- */
const SCHEMA_VERSION = 7;
/** Sequential migrations: MIGRATIONS[n] upgrades a state at version n to n+1. */
const MIGRATIONS = {
  1: st => {              // v1 -> v2: guarantee arrays/fields added after launch
    st.feedback ??= [];
    st.bodyweight ??= [];
    st.exercises.forEach(e=>{ e.fav ??= false; e.notes ??= ""; });
    st.logs.forEach(l=>{ l.durationMin ??= 0; l.notes ??= ""; });
    return st;
  },
  2: st => {              // v2 -> v3: cardio tracking
    st.cardio ??= [];
    return st;
  },
  3: st => {              // v3 -> v4: mesocycle lifecycle (archive flag)
    (st.mesocycles||[]).forEach(m=>{ m.archived ??= false; });
    return st;
  },
  4: st => {              // v4 -> v5: user profile + cardio-as-exercise
    st.profile ??= {gender:"", age:null, weightKg:null, heightCm:null, experience:"", goals:"", setupDismissed:false};
    // ensure any cardio exercises created before this version are tagged
    (st.exercises||[]).forEach(e=>{ if(e.muscle==="Cardio") e.cardio=true; });
    return st;
  },
  5: st => {              // v5 -> v6: Serious/Fun mode
    st.settings.mode ??= "fun";
    return st;
  },
  6: st => {              // v6 -> v7: seed starter template plans (once)
    if(!st._templatesSeeded){
      seedTemplates(st);
      st._templatesSeeded=true;
    }
    return st;
  },
};
function migrate(st){
  let v = st.version || 1;
  while(v < SCHEMA_VERSION){
    if(!MIGRATIONS[v]) break;
    st = MIGRATIONS[v](st);
    v++;
  }
  st.version = SCHEMA_VERSION;
  return st;
}
/** djb2 string hash — cheap integrity check for exports. */
function checksum(str){
  let hs=5381;
  for(let i=0;i<str.length;i++) hs=((hs<<5)+hs+str.charCodeAt(i))>>>0;
  return hs.toString(16);
}
/** Structural validation of an imported full-state object. Throws with a reason. */
function validateState(st){
  if(typeof st!=="object"||!st) throw new Error("not an object");
  if(!Array.isArray(st.exercises)) throw new Error("missing exercises array");
  if(!Array.isArray(st.mesocycles)) throw new Error("missing mesocycles array");
  if(!Array.isArray(st.logs)) throw new Error("missing logs array");
  if(typeof st.settings!=="object"||!st.settings) throw new Error("missing settings");
  for(const e of st.exercises)
    if(typeof e.id!=="string"||typeof e.name!=="string") throw new Error("malformed exercise entry");
  for(const m of st.mesocycles)
    if(typeof m.id!=="string"||!Array.isArray(m.days)) throw new Error("malformed mesocycle entry");
  for(const l of st.logs)
    if(typeof l.date!=="string"||!Array.isArray(l.exercises)) throw new Error("malformed workout log");
  if((st.version||1) > SCHEMA_VERSION)
    throw new Error(`file is from a newer app version (v${st.version})`);
  return true;
}

class StorageManager{
  constructor(key){
    this.key=key;
    this._t=null;            // debounce timer
    this._dirty=false;
    this.state=this.load();
    // flush pending writes when the page is hidden or closing
    window.addEventListener("visibilitychange", ()=>{ if(document.hidden) this.flush(); });
    window.addEventListener("pagehide", ()=>this.flush());
  }
  defaults(){
    const base={
      version:SCHEMA_VERSION,
      settings:{
        unit:"kg", theme:"light", restDefault:150,
        incUpper:2.5, incLower:5, incUpperSmall:1, incLowerSmall:2.5,
        backoffPct:5, backupEvery:7, lastBackup:null,
        maxHR:null, age:null,
        mode:"fun",           // "fun" (default) | "serious"
      },
      profile:{gender:"", age:null, weightKg:null, heightCm:null, experience:"", goals:"", setupDismissed:false},
      exercises:[...STARTER_EXERCISES],
      mesocycles:[], logs:[], bodyweight:[], feedback:[], cardio:[], _templatesSeeded:true,
      activeMesoId:null, activeSession:null, editSession:null,
    };
    seedTemplates(base);       // fresh installs get the starter templates too
    return base;
  }
  load(){
    try{
      const raw=localStorage.getItem(this.key);
      if(!raw) return this.defaults();
      let st=JSON.parse(raw);
      st=migrate(st);
      const have=new Set(st.exercises.map(e=>e.id));
      STARTER_EXERCISES.forEach(e=>{ if(!have.has(e.id)) st.exercises.push(e); });
      st.profile ??= {gender:"", age:null, weightKg:null, heightCm:null, experience:"", goals:"", setupDismissed:false};
      st.settings.mode ??= "fun";
      return Object.assign(this.defaults(), st,
        {settings:Object.assign(this.defaults().settings, st.settings||{})});
    }catch(e){
      console.error("State load failed; starting fresh. Raw data preserved under _corrupt.", e);
      try{ localStorage.setItem(this.key+"_corrupt", localStorage.getItem(this.key)||""); }catch(_){}
      return this.defaults();
    }
  }
  /** Debounced autosave (default). Critical moments call flush() directly. */
  save(){
    HistoryIndex.invalidate();
    this._dirty=true;
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.flush(), 400);
  }
  flush(){
    if(!this._dirty) return;
    clearTimeout(this._t);
    try{
      localStorage.setItem(this.key, JSON.stringify(this.state));
      this._dirty=false;
    }catch(e){
      console.error("save failed",e);
      toast("Save failed — storage may be full. Export your data now.");
      return;
    }
    this.maybeAutoBackup();
  }
  maybeAutoBackup(){
    const s=this.state.settings;
    if(!s.backupEvery) return;
    if(!s.lastBackup){
      s.lastBackup=new Date().toISOString();
      try{ localStorage.setItem(this.key, JSON.stringify(this.state)); }catch(_){}
      return;
    }
    if((Date.now()-new Date(s.lastBackup).getTime())/864e5 >= s.backupEvery){
      s.lastBackup=new Date().toISOString();
      try{ localStorage.setItem(this.key, JSON.stringify(this.state)); }catch(_){}
      try{ this.download(`liftdaddy-backup-${todayISO()}.json`); toast("Automatic backup downloaded"); }
      catch(e){ console.warn("backup failed",e); }
    }
  }
  /** Export wrapped with metadata + integrity checksum. */
  exportPayload(){
    const data=JSON.stringify(this.state);
    return JSON.stringify({app:"liftdaddy", version:this.state.version,
      exportedAt:new Date().toISOString(), checksum:checksum(data),
      data:this.state}, null, 2);
  }
  download(fname){
    const blob=new Blob([this.exportPayload()],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=fname||`liftdaddy-export-${todayISO()}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  /** Accepts wrapped exports (with checksum) and legacy raw-state files. */
  import(json){
    let parsed=JSON.parse(json), st, verified=false;
    if(parsed && (parsed.app==="liftdaddy"||parsed.app==="ironmeso") && parsed.data){
      st=parsed.data;
      if(parsed.checksum && parsed.checksum===checksum(JSON.stringify(st))) verified=true;
      else if(parsed.checksum) throw new Error("checksum mismatch — file is corrupted");
    } else st=parsed;                       // legacy raw export
    validateState(st);
    st=migrate(st);
    this.state=Object.assign(this.defaults(), st,
      {settings:Object.assign(this.defaults().settings, st.settings||{})});
    this._dirty=true; this.flush();
    return verified;
  }
}

/* ---------------- exercise history index ----------------
   Built lazily on first query after any mutation; avoids
   re-scanning every log for every exercise on every render. */
const HistoryIndex={
  _map:null,
  invalidate(){ this._map=null; },
  build(){
    const map=new Map();
    for(const log of S().logs){
      for(const ex of log.exercises){
        const sets=(ex.sets||[]).filter(s=>s.done);
        if(!sets.length) continue;
        const best=sets.reduce((a,b)=>epley(b.kg,b.reps)>epley(a.kg,a.reps)?b:a);
        const entry={date:log.date, mesoId:log.mesoId, week:log.week, sets,
          volume:sets.reduce((t,s)=>t+s.kg*s.reps,0),
          best, e1rm:epley(best.kg,best.reps)};
        if(!map.has(ex.exerciseId)) map.set(ex.exerciseId,[]);
        map.get(ex.exerciseId).push(entry);
      }
    }
    for(const arr of map.values()) arr.sort((a,b)=>b.date.localeCompare(a.date));
    this._map=map;
  },
  get(exId){
    if(!this._map) this.build();
    return this._map.get(exId)||[];
  }
};

/* ---------------- progression engine ---------------- */
class ProgressionEngine{
  /**
   * Suggest next load based on the WHOLE last workout for this exercise:
   * - working weight = the weight used for most sets (mode), not the single best set
   * - performance judged across every working set (reps + RIR)
   * Returns {kg, lastKg, diff, reason, lastSummary} or null with no history.
   */
  static suggest(exId, targetReps, targetRIR){
    const st=S().settings;
    const hist=exerciseHistory(exId);
    if(!hist.length) return null;
    const last=hist[0];
    const ex=exById(exId);
    const lower=ex && LOWER.has(ex.muscle);
    const sets=last.sets;
    // Working weight: modal weight across sets (ties -> heavier)
    const counts=new Map();
    sets.forEach(s=>counts.set(s.kg,(counts.get(s.kg)||0)+1));
    const lastKg=[...counts.entries()].sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0][0];
    const work=sets.filter(s=>s.kg===lastKg);
    // Whole-workout performance: each set judged against its own prescribed
    // reps (expReps) when present — a planned 14/13/12 hit as 14/13/12 is a
    // full success, not a "missed 14 twice".
    const exp=s=>s.expReps??targetReps;
    const hitAll   = work.every(s=>s.reps>=exp(s));
    const hitMost  = work.filter(s=>s.reps>=exp(s)).length >= Math.ceil(work.length*0.67);
    const nearAll  = work.every(s=>s.reps>=exp(s)-1);
    const avgRIR   = work.reduce((t,s)=>t+s.rir,0)/work.length;
    const minRIR   = Math.min(...work.map(s=>s.rir));
    // Recovery modifier from the latest post-workout survey
    const fb=S().feedback[S().feedback.length-1];
    let recovMod=1;
    if(fb){
      const strain=(fb.fatigue+fb.jointPain+(5-fb.recovery)+(5-fb.sleep))/4;
      if(strain>=3.5) recovMod=0;
      else if(strain>=2.5) recovMod=.5;
    }
    // Assisted exercises (assisted pull-up/dip machines) invert the logic:
    // LESS assistance weight = harder = progress. We flip the sign of every
    // load change so suggestions move the right way, and clamp at 0 (unassisted).
    const assisted = !!(ex && ex.assisted);
    const dir = assisted? -1 : 1;
    const bigInc = (lower? st.incLower : st.incUpper) * dir;
    const smallInc = (lower? st.incLowerSmall : st.incUpperSmall) * dir;
    let kg=lastKg, reason;
    if(hitAll && avgRIR>targetRIR && minRIR>=targetRIR){
      if(recovMod===1){ kg=lastKg+bigInc; reason=assisted?"All sets strong — drop the assistance a notch.":"All sets beat target with reps in reserve — add load."; }
      else if(recovMod===.5){ kg=lastKg+smallInc; reason=assisted?"Strong sets, but recovery is poor — small assistance drop.":"All sets beat target, but recovery is poor — smaller jump."; }
      else { reason="All sets strong, but recovery is poor — hold here."; }
    } else if(hitAll){
      if(recovMod===1){ kg=lastKg+smallInc; reason=assisted?"Hit target at the limit — small assistance drop.":"Every set hit target at the limit — small increase."; }
      else { reason="Target met at the limit — repeat this."; }
    } else if(hitMost && nearAll){
      reason="Most sets hit target — repeat and complete every set.";
    } else {
      // fell short: assisted → ADD assistance (easier); normal → back off load
      kg = assisted? lastKg*(1+st.backoffPct/100) : lastKg*(1-st.backoffPct/100);
      reason=assisted?`Short of target — add ${st.backoffPct}% assistance and rebuild.`:`Sets fell short of target — back off ${st.backoffPct}% and rebuild.`;
    }
    kg=Math.round(kg/wStep())*wStep();
    kg=Math.round(kg*100)/100;
    if(assisted) kg=Math.max(0,kg);      // can't have negative assistance
    const bs=last.best;
    return {kg, lastKg, diff:Math.round((kg-lastKg)*100)/100, reason,
      lastSummary:`${dispW(lastKg)}${unitLabel()} × ${work.map(s=>s.reps).join("/")} @~${Math.round(avgRIR*10)/10}RIR`};
  }
}

/* ---------------- charts (no libraries) ---------------- */
class ChartManager{
  /** Simple responsive line/bar chart on a canvas. data: [{x:label,y:num}] */
  static draw(canvas, data, {type="line", color, fill=true, yFmt=v=>v}={}){
    const css=getComputedStyle(document.body);
    color = color || css.getPropertyValue("--accent").trim();
    const dpr=window.devicePixelRatio||1;
    const W=canvas.clientWidth||320, H=canvas.clientHeight||180;
    canvas.width=W*dpr; canvas.height=H*dpr;
    const ctx=canvas.getContext("2d"); if(!ctx) return; ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,W,H);
    const line=css.getPropertyValue("--line").trim();
    const muted=css.getPropertyValue("--muted").trim();
    if(!data.length){ ctx.fillStyle=muted; ctx.font="600 13px sans-serif";
      ctx.textAlign="center"; ctx.fillText("No data yet",W/2,H/2); return; }
    const pad={l:38,r:10,t:12,b:22};
    const ys=data.map(d=>d.y);
    let ymin=Math.min(...ys), ymax=Math.max(...ys);
    if(ymin===ymax){ ymin=ymin*0.9-1; ymax=ymax*1.1+1; }
    else { const m=(ymax-ymin)*.12; ymin-=m; ymax+=m; }
    if(type==="bar") ymin=Math.min(0,ymin);
    const px=i=>pad.l+(W-pad.l-pad.r)*(data.length===1?.5:i/(data.length-1));
    const py=v=>H-pad.b-(H-pad.t-pad.b)*((v-ymin)/(ymax-ymin));
    // gridlines
    ctx.strokeStyle=line; ctx.lineWidth=1; ctx.fillStyle=muted; ctx.font="600 10px sans-serif";
    for(let g=0; g<4; g++){
      const v=ymin+(ymax-ymin)*g/3, y=py(v);
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
      ctx.textAlign="right"; ctx.fillText(yFmt(Math.round(v*10)/10), pad.l-5, y+3);
    }
    // x labels: first, middle, last
    ctx.textAlign="center";
    [0, Math.floor((data.length-1)/2), data.length-1]
      .filter((v,i,a)=>a.indexOf(v)===i)
      .forEach(i=>ctx.fillText(String(data[i].x).slice(0,10), px(i), H-6));
    if(type==="bar"){
      const bw=clamp((W-pad.l-pad.r)/data.length*.6, 3, 34);
      ctx.fillStyle=color;
      data.forEach((d,i)=>{ const x=px(i)-bw/2, y=py(d.y), h=Math.max(2,H-pad.b-y);
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(x,y,bw,h,3); else ctx.rect(x,y,bw,h);
        ctx.fill(); });
    } else {
      if(fill){
        const g=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
        g.addColorStop(0,color+"55"); g.addColorStop(1,color+"00");
        ctx.beginPath(); ctx.moveTo(px(0),H-pad.b);
        data.forEach((d,i)=>ctx.lineTo(px(i),py(d.y)));
        ctx.lineTo(px(data.length-1),H-pad.b); ctx.closePath();
        ctx.fillStyle=g; ctx.fill();
      }
      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.beginPath();
      data.forEach((d,i)=>i?ctx.lineTo(px(i),py(d.y)):ctx.moveTo(px(i),py(d.y)));
      ctx.stroke();
      ctx.fillStyle=color;
      data.forEach((d,i)=>{ ctx.beginPath(); ctx.arc(px(i),py(d.y),3,0,7); ctx.fill(); });
    }
  }
}

/** Stacked bar chart: data=[{x, parts:{key:val}}], colors={key:cssColor}. */
ChartManager.stacked=function(canvas, data, colors, keys){
  const css=getComputedStyle(document.body);
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth||320, H=canvas.clientHeight||180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext("2d"); if(!ctx) return; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const line=css.getPropertyValue("--line").trim(), muted=css.getPropertyValue("--muted").trim();
  if(!data.length || !data.some(d=>keys.some(k=>d.parts[k]))){
    ctx.fillStyle=muted; ctx.font="600 13px sans-serif"; ctx.textAlign="center";
    ctx.fillText("No data yet",W/2,H/2); return;
  }
  const pad={l:34,r:8,t:10,b:22};
  const totals=data.map(d=>keys.reduce((t,k)=>t+(d.parts[k]||0),0));
  const ymax=Math.max(...totals)*1.1||1;
  const px=i=>pad.l+(W-pad.l-pad.r)*((i+0.5)/data.length);
  const py=v=>H-pad.b-(H-pad.t-pad.b)*(v/ymax);
  ctx.strokeStyle=line; ctx.fillStyle=muted; ctx.font="600 10px sans-serif";
  for(let g=0; g<4; g++){
    const v=ymax*g/3, y=py(v);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.textAlign="right"; ctx.fillText(Math.round(v), pad.l-5, y+3);
  }
  ctx.textAlign="center";
  [0, Math.floor((data.length-1)/2), data.length-1]
    .filter((v,i,a)=>a.indexOf(v)===i)
    .forEach(i=>ctx.fillText(String(data[i].x).slice(0,10), px(i), H-6));
  const bw=clamp((W-pad.l-pad.r)/data.length*.55, 4, 36);
  data.forEach((d,i)=>{
    let yBase=H-pad.b;
    keys.forEach(k=>{
      const v=d.parts[k]||0; if(!v) return;
      const hgt=(H-pad.t-pad.b)*(v/ymax);
      ctx.fillStyle=colors[k];
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(px(i)-bw/2, yBase-hgt, bw, hgt, 2); else ctx.rect(px(i)-bw/2, yBase-hgt, bw, hgt);
      ctx.fill();
      yBase-=hgt;
    });
  });
};

let toastTimer=null;
function toast(msg, cls=""){

  const t=document.createElement("div"); t.className="toast "+cls; t.textContent=msg;
  document.body.appendChild(t);

let _modalReturnFocus=null;
function modal(html, onMount){
  closeModal();
  _modalReturnFocus=document.activeElement;
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click",e=>{ if(e.target===bg) closeModal(); });
  bg.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ e.stopPropagation(); closeModal(); }
    if(e.key==="Enter" && !/TEXTAREA/.test(e.target.tagName)){
      // Enter confirms: press the primary action if one exists
      const ok=bg.querySelector("[data-ok],[data-done]");
      if(ok && e.target.tagName!=="BUTTON"){ e.preventDefault(); ok.click(); }
    }
    if(e.key==="Tab"){                     // simple focus trap
      const f=$$("button, input, select, textarea, [tabindex]", bg)
        .filter(el=>!el.disabled && el.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });
  $("#overlay").appendChild(bg);
  const m=bg.firstElementChild;
  // focus first field, else first button
  const first=m.querySelector("input, select, textarea") || m.querySelector("button");
  if(first) first.focus();
  if(onMount) onMount(m);
  return m;
}
function closeModal(){
  $("#overlay").innerHTML="";
  if(_modalReturnFocus && document.contains(_modalReturnFocus)){
    try{ _modalReturnFocus.focus(); }catch(_){}
  }
  _modalReturnFocus=null;
}

/* ---------------- router + nav ---------------- */
const VIEWS={};
let currentView="home";
function go(view, ...args){
  const name=view.split("/")[0];
  if(!VIEWS[name]){ console.warn("Unknown view:", name); return; }
  currentView=name;
  // rest timer is global now and intentionally persists across views
  try{ window.scrollTo(0,0); }catch(_){}
  try{ VIEWS[name](...args); }
  catch(err){
    console.error("View render failed:", name, err);
    $("#view").innerHTML=`<div class="card err-card"><h3>Something went wrong</h3>
      <p class="muted">This screen failed to load (${esc(err.message)}). Your data is safe.</p>
      <button class="btn btn-ghost" onclick="go('home')">Back to Home</button></div>`;
  }
  syncHistory(name);
  renderNav();
}
/** Keep a single synthetic history entry per non-home view, and a base entry
    for home, so the hardware back button maps to in-app navigation instead of
    closing the app on the first press. */
/* ---------------- Deterministic hardware back-button model ----------------
   Exactly two conceptual states in the history stack:
     • BASE   (level 0) — home. Pressing back here falls through to the OS
       (which minimises/closes the installed app).
     • DETAIL (level 1) — any non-home view. Pressing back pops to BASE → home.
   We keep AT MOST one DETAIL entry no matter how many screens you visit, so
   back is always a single, predictable hop to home. All navigation funnels
   through syncHistory; a guard prevents popstate-driven nav from re-stacking. */
let _histReady=false, _navigating=false, _atDetail=false;
function syncHistory(name){
  if(_navigating) return;                       // popstate is driving; don't touch the stack
  try{
    if(!_histReady){
      history.replaceState({lvl:0}, "");         // establish BASE once, on first render
      _histReady=true; _atDetail=false;
    }
    if(name==="home"){
      if(_atDetail){                             // collapse back down to BASE
        _navigating=true;
        history.back();                          // pop the single DETAIL entry
        _navigating=false;
        _atDetail=false;
      }
      // already at BASE → nothing to do
    } else {
      if(!_atDetail){                            // entering DETAIL from BASE: push ONE entry
        history.pushState({lvl:1}, "");
        _atDetail=true;
      }
      // moving DETAIL→DETAIL (e.g. Mesos→Stats): keep the single entry, no push
    }
  }catch(_){}
}
window.addEventListener("popstate", ()=>{

  // us on BASE → show home. If we were already at home/BASE, let it be (the OS
  // handles closing; we don't re-push, so a second back exits).
  if(_navigating) return;                        // our own history.back() above
  if(_atDetail || currentView!=="home"){
    _atDetail=false;
    _navigating=true;

    _navigating=false;

/* ---------------- session helpers ---------------- */
/** Current position in the active meso: which week/day is next. */
function mesoPosition(meso){
  if(!meso || !meso.days || !meso.days.length)
    return {week:1, dayIdx:0, day:null, finished:false, done:0, total:0};
  const done=S().logs.filter(l=>l.mesoId===meso.id);
  const totalDays=meso.days.length;
  const n=done.length;
  const week=Math.min(Math.floor(n/totalDays)+1, meso.weeks);
  const dayIdx=n%totalDays;
  const finished=n>=totalDays*meso.weeks;
  return {week, dayIdx, day:meso.days[dayIdx], finished, done:n, total:totalDays*meso.weeks};
}
function isDeload(meso,week){ return meso.deload && week===meso.weeks; }
/* A logged workout is editable only if it belongs to the ACTIVE meso and is one
   of the 6 most recent logged workouts in that meso. Everything older, archived,
   or in a non-active meso is read-only. Future planned workouts are always
   read-only previews. */
const EDIT_WINDOW=6;
function logEditable(log){
  if(!log) return false;
  if(log.mesoId!==S().activeMesoId) return false;         // not the active meso
  const meso=activeMeso(); if(!meso || meso.archived) return false;
  const mlogs=S().logs.filter(l=>l.mesoId===log.mesoId)
    .sort((a,b)=>a.date.localeCompare(b.date) || (a.id>b.id?1:-1));
  const idx=mlogs.findIndex(l=>l.id===log.id);
  return idx>=0 && idx >= mlogs.length-EDIT_WINDOW;        // within the last 6
}
function streakCount(){
  const dates=[...new Set(S().logs.map(l=>l.date))].sort().reverse();
  if(!dates.length) return 0;
  let streak=0, cursor=new Date();
  for(const d of dates){
    const diff=Math.floor((cursor-new Date(d+"T12:00"))/864e5);
    if(diff<=7){ streak++; cursor=new Date(d+"T12:00"); } else break;
  }
  return streak;
}

      const chip=$("#czone",m);

        const p=Math.round(hr/mx*100);

        notes:$("#cnotes",m).value.trim()});
      Store.save(); closeModal(); toast("Cardio logged"); go("home");
    };
  });

      {name:"Cardio", ex:[C("Stationary Bike",30,135)]},

        </div>

          <input type="checkbox" id="mdeload" style="width:22px;height:22px" ${m.deload?"checked":""}> Final week is a ${term("deload")}</label>
        <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;margin-top:12px">
          <input type="checkbox" id="mramp" style="width:22px;height:22px" ${m.rampSets?"checked":""}> Volume ramp — add one set per exercise each week (caps at +2, deload resets)</label>
        <label>${term("Meso")} notes</label><textarea id="mnotes" rows="2" placeholder="Goals, focus, cues…">${esc(m.notes||"")}</textarea>
      </div>
      <div class="row split" style="margin:6px 2px 10px"><h3>Training days</h3>
        <button class="btn btn-ghost btn-sm" data-a="addday">+ Day</button></div>
      <div id="days">${m.days.map((d,di)=>dayCard(d,di)).join("")}</div>
      <button class="btn btn-primary btn-block" data-a="save" style="margin-top:4px">Done</button>`;
    bindDayEvents();
    // autosave on every field edit
    $$("#view input, #view select, #view textarea").forEach(el=>{
      el.addEventListener("input", autosave);
      el.addEventListener("change", autosave);
    });
  }
  function dayCard(d,di){
    return `<div class="card" data-day="${di}">
      <div class="row split"><input value="${esc(d.name)}" data-dname="${di}" style="font-weight:800;background:transparent;border:0;padding:4px 0;font-size:17px">
        <button class="iconbtn" data-deld="${di}" aria-label="Remove day">✕</button></div>
      <div class="stack" data-exlist="${di}">
        ${d.exercises.map((x,xi)=>{
          const ex=exById(x.exerciseId);
          const cardio=x.cardio || isCardioEx(x.exerciseId);
          const meta=cardio? `${x.minutes||20} min${x.targetHR?` · target ${x.targetHR}bpm`:""}${x.notes?" · "+esc(x.notes):""}`
                           : `${x.sets}×${x.reps} · ${rirTxt(x.rir)} · rest ${x.rest}s${x.notes?" · "+esc(x.notes):""}`;
          return `<div class="setline dragrow" draggable="true" data-ex="${di}:${xi}">
            <span class="draghandle">⠿</span>
            <div class="grow" style="flex:1;min-width:0">
              <div>${cardio?"🫀 ":""}${esc(ex?ex.name:"?")}</div>
              <div class="faint num">${meta}</div></div>
            <button class="iconbtn" data-editx="${di}:${xi}" aria-label="Edit exercise targets">✎</button>
            <button class="iconbtn" data-delx="${di}:${xi}" aria-label="Remove exercise">✕</button></div>`;
        }).join("")}
      </div>
      <button class="btn btn-ghost btn-block btn-sm" style="margin-top:10px" data-addx="${di}">+ Add exercise</button>
    </div>`;
  }
  function collectBasics(){
    if(!$("#mname")) return;
    m.name=$("#mname").value.trim()||m.name||"Untitled block";
    m.weeks=clamp(parseInt($("#mweeks").value)||5,1,16);
    m.deload=$("#mdeload").checked;
    m.rampSets=$("#mramp")?.checked??false;
    m.notes=$("#mnotes").value;
    $$("[data-dname]").forEach(inp=>m.days[+inp.dataset.dname].name=inp.value.trim()||"Day");
  }
  function bindDayEvents(){
    $("#msplit").onchange=e=>{
      collectBasics(); m.split=e.target.value;
      if(!m.days.some(d=>d.exercises.length))
        m.days=SPLITS[m.split].map(n=>({id:uid(),name:n,exercises:[]}));
      render();
    };
    // Drag and drop ordering — position is computed during dragover for the
    // visual indicator only; the array mutates once, on drop.
    let dragging=null;
    const clearMarks=()=>$$(".dragrow").forEach(r=>r.classList.remove("drop-before","drop-after"));
    $$(".dragrow").forEach(row=>{
      row.addEventListener("dragstart",e=>{
        dragging=row; row.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        try{ e.dataTransfer.setData("text/plain", row.dataset.ex); }catch(_){}
      });
      row.addEventListener("dragend",()=>{ row.classList.remove("dragging"); clearMarks(); dragging=null; });
      row.addEventListener("dragover",e=>{
        e.preventDefault();
        if(!dragging||dragging===row) return;
        if(dragging.dataset.ex.split(":")[0]!==row.dataset.ex.split(":")[0]) return; // same day only
        clearMarks();
        const before=e.offsetY < row.offsetHeight/2;
        row.classList.add(before?"drop-before":"drop-after");
      });
      row.addEventListener("drop",e=>{
        e.preventDefault();
        if(!dragging||dragging===row) return;
        const [sdi,sxi]=dragging.dataset.ex.split(":").map(Number);
        const [tdi,txi]=row.dataset.ex.split(":").map(Number);
        if(sdi!==tdi) return;
        const before=e.offsetY < row.offsetHeight/2;
        const arr=m.days[tdi].exercises;
        const [item]=arr.splice(sxi,1);
        let dest=txi + (before?0:1);
        if(sxi<txi) dest--;                  // account for removal shift
        arr.splice(clamp(dest,0,arr.length),0,item);
        collectBasics(); Store.save(); render();
      });
    });
    $("#view").onclick=e=>{
      const t=e.target.closest("[data-a],[data-addx],[data-editx],[data-delx],[data-deld]");
      if(!t) return;
      if(t.dataset.a==="back"||t.dataset.a==="save"){

        if(!nm){ toast(`Give the ${term("meso")} a name`); $("#mname")?.focus(); return; }

          toast(`A ${term("meso")} with that name already exists`); $("#mname")?.focus(); return; }
        autosave(); toast(`${term("Meso")} saved`); go("mesos"); return;
      }
      if(t.dataset.a==="addday"){ collectBasics(); m.days.push({id:uid(),name:"Day "+(m.days.length+1),exercises:[]}); Store.save(); render(); return; }
      if(t.dataset.deld!=null){ collectBasics(); if(confirm("Remove this day?")){ m.days.splice(+t.dataset.deld,1); Store.save(); render(); } return; }
      if(t.dataset.addx!=null){ collectBasics(); pickExercise(exId=>{
        const slot=isCardioEx(exId)
          ? {id:uid(), exerciseId:exId, cardio:true, minutes:20, targetHR:null, notes:""}
          : {id:uid(), exerciseId:exId, sets:3, reps:10, rir:2, rest:S().settings.restDefault, notes:""};
        m.days[+t.dataset.addx].exercises.push(slot);
        Store.save(); render();
      }); return; }
      if(t.dataset.delx!=null){ collectBasics(); const [di,xi]=t.dataset.delx.split(":").map(Number);
        m.days[di].exercises.splice(xi,1); Store.save(); render(); return; }
      if(t.dataset.editx!=null){ collectBasics(); const [di,xi]=t.dataset.editx.split(":").map(Number);
        editSlot(m.days[di].exercises[xi], ()=>{Store.save(); render();}); return; }
    };
  }
  render();
}

function pickExercise(onPick){
  let filter="All";
  // groups present in the library, Cardio surfaced first, then the rest by frequency
  const present=[...new Set(S().exercises.map(e=>e.muscle))];
  const order=["Cardio",...MUSCLES.filter(m=>m!=="Cardio")].filter(m=>present.includes(m));

    draw();

/* ================= VIEW: WORKOUT (core screen) =================
   RP-style layout: every exercise visible in one scrollable list,
   one editable row per set, tap the check to log. */
let restInterval=null;

/** Build pre-filled set rows for a session exercise. */
function buildSetRows(count, kg, reps, rir){
  return Array.from({length:count},()=>({kg, reps, rir, expReps:reps, done:false, at:null}));
}
/**
 * Per-set rep expectations, RP-style: each set's ghost comes from last week's
 * same-numbered set at the working weight, so natural fatigue drop-off
 * (14/13/12) is planned rather than punished.
 *  - weight went UP   -> match last week's reps per set at the heavier load
 *  - weight REPEATED  -> beat last week by one rep per set
 *  - backoff/deload   -> flat target reps
 */
function buildGhostRows(exId, count, kg, targetReps, rir, sug, deload){
  if(!sug || deload || sug.kg<sug.lastKg) return buildSetRows(count, kg, targetReps, rir);
  const hist=exerciseHistory(exId);
  const work=hist.length? hist[0].sets.filter(s=>s.kg===sug.lastKg):[];
  const bump=sug.kg===sug.lastKg? 1:0;
  return Array.from({length:count},(_,i)=>{
    const base=work.length? work[Math.min(i,work.length-1)].reps : targetReps;
    const reps=Math.max(1, base+bump);
    return {kg, reps, rir, expReps:reps, done:false, at:null};
  });
}
/** Older sessions stored steppers + a grow-only sets array; upgrade in place. */
function upgradeSession(s){
  s.exercises.forEach(e=>{
    if(e.rowsReady) return;
    const done=(e.sets||[]).map(x=>({...x, done:true}));
    const kg=e.curKg ?? (e.suggestion? e.suggestion.kg:0);
    const remaining=Math.max(0, e.target.sets-done.length);
    e.sets=[...done, ...buildSetRows(remaining, kg, e.curReps??e.target.reps, e.curRIR??e.target.rir)];
    e.rowsReady=true;
  });
}

VIEWS.workout=function(){
  const st=S();
  if(st.editSession){ renderWorkout(); return; }   // editing a past workout takes precedence
  if(!st.activeSession){
    const meso=activeMeso();
    if(!meso){ $("#view").innerHTML=`<div class="topbar"><h1>Train</h1></div>
      <div class="empty">No active ${term("meso")}.<br><br><button class="btn btn-primary" onclick="go('mesos','new')">Create one</button></div>`; return; }
    const pos=mesoPosition(meso);
    if(!pos.day){ $("#view").innerHTML=`<div class="topbar"><h1>Train</h1></div>
      <div class="empty">This ${term("meso")} has no training days yet.<br><br><button class="btn btn-primary" onclick="go('mesos')">Edit</button></div>`; return; }
    if(pos.finished){ $("#view").innerHTML=`<div class="topbar"><h1>Train</h1></div>
      <div class="empty">${term("Meso")} complete${FUN()?" 🎉":""}<br>Duplicate it from the ${term("mesoNav")} tab to keep going.</div>`; return; }
    const deload=isDeload(meso,pos.week);
    st.activeSession={
      id:uid(), mesoId:meso.id, week:pos.week, dayIdx:pos.dayIdx, dayId:pos.day.id, dayName:pos.day.name,
      mesoName:meso.name, date:todayISO(), startedAt:Date.now(), notes:"", deload,
      exercises:pos.day.exercises.map(slot=>{
        if(slot.cardio || isCardioEx(slot.exerciseId)){
          // cardio item: duration + HR, logged into the cardio store on finish
          return {slotId:slot.id, exerciseId:slot.exerciseId, cardio:true,
            target:{minutes:slot.minutes||20, targetHR:slot.targetHR||null, notes:slot.notes||""},
            notes:"", skipped:false, rowsReady:true, done:false,
            log:{minutes:slot.minutes||20, avgHR:null, distanceKm:null, level:null, speed:null, incline:null}, sets:[]};
        }
        const sug=ProgressionEngine.suggest(slot.exerciseId, slot.reps, slot.rir);
        let kg=sug? sug.kg : 0;
        // volume ramp: +1 set per week after week 1 (capped +2); deload halves sets
        let nSets=slot.sets + (meso.rampSets && !deload? Math.min(pos.week-1, 2):0);
        if(deload){ nSets=Math.max(1, Math.ceil(slot.sets/2)); if(sug) kg=Math.round((sug.lastKg*0.6)/wStep())*wStep(); }
        return {slotId:slot.id, exerciseId:slot.exerciseId,
          target:{sets:nSets, reps:slot.reps, rir:slot.rir, rest:slot.rest, notes:slot.notes},
          suggestion: deload&&sug? {...sug, kg, diff:kg-sug.lastKg, reason:FUN()?"Recovery week — lighter and shorter on purpose.":"Deload — ~60% load, half the sets."} : sug,
          notes:"", skipped:false, rowsReady:true,
          sets:buildGhostRows(slot.exerciseId, nSets, kg, slot.reps, slot.rir, sug, deload)};
      })
    };
    Store.save(); Store.flush();
  }
  upgradeSession(st.activeSession);
  renderWorkout();
};

function sessionTotals(s){
  const active=s.exercises.filter(e=>!e.skipped);
  const total=active.reduce((t,e)=>t+(e.cardio?1:e.sets.length),0);
  const done=active.reduce((t,e)=>t+(e.cardio?(e.done?1:0):e.sets.filter(x=>x.done).length),0);
  return {total, done};
}

function renderWorkout(){
  const s=S().editSession||S().activeSession;
  if(!s) return go("home");
  const edit=s.mode==="edit";
  const ro=!!s.readonly;                       // read-only: locked past or future preview
  const {total,done}=sessionTotals(s);
  if(!edit && done===0){ s.startedAt=Date.now(); }
  const mins=Math.floor((Date.now()-s.startedAt)/60000);
  const dateLbl=s.future? `W${s.week} · planned` : (s.date? fmtDate(s.date):"");

      <button style="text-align:left" data-a="${ro?"":"picker"}" aria-label="Choose another workout">

        <div class="top-sub">${esc(s.dayName)}${ro? ` · ${dateLbl}` : ` · <button class="linkdate" data-a="setdate" aria-label="Change workout date">${fmtDate(s.date)} ✎</button>`}${!edit&&s.mesoName?` · ${esc(s.mesoName)}`:""}${s.deload?` · ${term("Deload")}`:""}</div>
      </button>
      <div class="row">
        ${ro?"":'<button class="iconbtn" data-a="wnotes" aria-label="Workout notes">✎</button>'}
        <button class="iconbtn" data-a="quit" aria-label="Close">✕</button>
      </div>
    </div>
    ${ro? `<div class="ro-banner">${s.future
        ? "🔒 Planned workout — read-only preview. Weights are projections."
        : "🔒 Read-only — outside the editable window ("+EDIT_WINDOW+" most recent in your active "+term("meso")+")."}</div>`:""}
    <div class="wk-progress" role="progressbar" aria-valuenow="${done}" aria-valuemax="${total}">
      <div class="fill" id="pfill" style="width:${total?Math.round(100*done/total):0}%"></div></div>
    <div class="row split" style="margin-bottom:12px">
      <span class="faint num" id="ptext">${done}/${total} sets${ro?"":` · ${mins} min`}</span>

      <button class="btn btn-primary" style="flex:2" data-a="finish">${edit?"Save changes":"Complete workout"}</button>
    </div>`}
`;
  bindWorkout();
}

/** Modal listing every workout in the active meso: past (editable), current, upcoming. */
function workoutPicker(){
  const meso=activeMeso();
  if(!meso || !meso.days.length){ toast(`No active ${term("meso")}`); return; }
  const logs=S().logs.filter(l=>l.mesoId===meso.id);
  const nDays=meso.days.length;
  let rows="";
  for(let i=0;i<meso.weeks*nDays;i++){
    const wk=Math.floor(i/nDays)+1, di=i%nDays, day=meso.days[di];
    const log=logs[i];
    const cur=!log && i===logs.length;
    if(log){
      const canEdit=logEditable(log);
      rows+=`<div class="listitem" style="padding:10px 14px;margin-bottom:8px">
        <div class="grow" data-editlog="${log.id}"><div class="title num">W${wk} · ${esc(log.dayName)}</div>
        <div class="faint num">${fmtDate(log.date)} · ${log.exercises.reduce((t,e)=>t+e.sets.length,0)} sets</div></div>
        <span class="pill" data-editlog="${log.id}">${canEdit?"Edit":"View"}</span>
        ${canEdit?`<button class="iconbtn" data-dellog="${log.id}" aria-label="Delete workout">✕</button>`:""}</div>`;
    } else if(cur){
      rows+=`<div class="listitem" data-cur style="padding:10px 14px;margin-bottom:8px;border-color:var(--accent)">
        <div class="grow"><div class="title num">W${wk} · ${esc(day.name)}</div>
        <div class="faint">Current workout</div></div><span class="pill acc">Now</span></div>`;
    } else if(i>logs.length && i<=logs.length+5){   // next 5 upcoming only
      rows+=`<div class="listitem" data-pv="${di}" data-pw="${wk}" style="padding:10px 14px;margin-bottom:8px;opacity:.55">
        <div class="grow"><div class="title num">W${wk} · ${esc(day.name)}</div>
        <div class="faint">Upcoming — tap to preview</div></div><span class="pill">🔒</span></div>`;
    }
  }
  modal(`<h2>${esc(meso.name)}</h2>
    <p class="muted">Tap a past workout to edit it — add anything you forgot. Your current workout is untouched.</p>
    <div style="max-height:60vh;overflow:auto;margin-top:10px">${rows}</div>`, m=>{
    m.onclick=e=>{
      const pv=e.target.closest("[data-pv]");
      if(pv){ closeModal(); startFuturePreview(+pv.dataset.pw, +pv.dataset.pv); return; }
      const dl=e.target.closest("[data-dellog]");
      if(dl){ closeModal(); confirmDeleteLog(dl.dataset.dellog); return; }
      const el=e.target.closest("[data-editlog]");
      if(el){ closeModal(); startLogEdit(el.dataset.editlog); return; }
      if(e.target.closest("[data-cur]")){
        closeModal();
        if(S().editSession){ S().editSession=null; Store.save(); }
        go("workout");
      }
    };
  });
}

/** Open a completed log in the workout UI for editing; changes write back on Save. */
function startLogEdit(logId, forceReadonly){
  const log=S().logs.find(l=>l.id===logId);
  if(!log) return;
  const meso=mesoById(log.mesoId);
  const idx=S().logs.filter(l=>l.mesoId===log.mesoId).indexOf(log);
  const readonly=forceReadonly || !logEditable(log);
  // Lifting exercises come from the log; cardio comes from the cardio store for
  // this workout's date (that's where in-workout cardio was saved), so editing
  // a past workout shows — and can change — its cardio too.
  const liftEx=log.exercises.map(e=>({slotId:null, exerciseId:e.exerciseId,
    target:e.target||{sets:e.sets.length,reps:10,rir:2,rest:0,notes:""},
    suggestion:null, notes:e.notes||"", skipped:false, rowsReady:true, _edit:true,
    sets:(e.sets||[]).map(x=>({kg:x.kg, reps:x.reps, rir:x.rir, expReps:x.expReps??x.reps,
      done:true, touched:true, at:x.at||null}))}));
  const dayCardio=S().cardio.filter(c=>c.date===log.date && c.mesoId===log.mesoId && c.fromWorkout);
  const cardioEx=dayCardio.map(c=>{
    const exId=(S().exercises.find(e=>e.name===c.type)||{}).id || null;
    return {slotId:null, exerciseId:exId, cardio:true, cardioId:c.id,
      target:{minutes:c.minutes, targetHR:null, notes:""},
      notes:c.notes||"", skipped:false, rowsReady:true, done:true, _edit:true,
      log:{minutes:c.minutes, avgHR:c.avgHR, distanceKm:c.distanceKm, level:c.level, speed:c.speed, incline:c.incline},
      _cardioName:c.type, sets:[]};
  });
  S().editSession={
    mode:"edit", readonly, logId:log.id, mesoId:log.mesoId, week:log.week,
    dayId:log.dayId,
    dayIdx:meso? idx%Math.max(1,meso.days.length):0,
    dayName:log.dayName, mesoName:meso?meso.name:"", date:log.date,
    startedAt:Date.now(), notes:log.notes||"", deload:false,
    exercises:[...liftEx, ...cardioEx]
  };
  Store.save();
  go("workout");
}
/** Open a FUTURE planned workout (from the meso template) as a full read-only
    view with projected weights. */
function startFuturePreview(week, dayIdx){
  const meso=activeMeso(); if(!meso) return;
  const day=meso.days[dayIdx]; if(!day) return;
  const deload=isDeload(meso, week);
  S().editSession={
    mode:"edit", readonly:true, future:true, logId:null, mesoId:meso.id, week,
    dayId:day.id, dayIdx, dayName:day.name, mesoName:meso.name,
    date:null, startedAt:Date.now(), notes:day.notes||"", deload,
    exercises:day.exercises.map(slot=>{
      if(slot.cardio || isCardioEx(slot.exerciseId))
        return {slotId:slot.id, exerciseId:slot.exerciseId, cardio:true,
          target:{minutes:slot.minutes||20, targetHR:slot.targetHR||null, notes:slot.notes||""},
          notes:"", skipped:false, rowsReady:true, done:false,
          log:{minutes:slot.minutes||20, avgHR:null, distanceKm:null}, sets:[]};
      const sug=ProgressionEngine.suggest(slot.exerciseId, slot.reps, slot.rir);
      let kg=sug?sug.kg:0;
      let nSets=slot.sets + (meso.rampSets && !deload? Math.min(week-1,2):0);
      if(deload){ nSets=Math.max(1,Math.ceil(slot.sets/2)); if(sug) kg=Math.round((sug.lastKg*0.6)/wStep())*wStep(); }
      return {slotId:slot.id, exerciseId:slot.exerciseId,
        target:{sets:nSets, reps:slot.reps, rir:slot.rir, rest:slot.rest, notes:slot.notes},
        suggestion:sug, notes:"", skipped:false, rowsReady:true, _edit:false,
        sets:buildGhostRows(slot.exerciseId, nSets, kg, slot.reps, slot.rir, sug, deload)};
    })
  };
  Store.save();
  go("workout");
}

/** Write an edit session back into its log. Unchecked sets are removed. */
/** Change the date of the in-progress or editing session. */
function pickWorkoutDate(s){
  modal(`<h2>Workout date</h2>
    <p class="muted">Set when this workout happened.</p>
    <input id="wd" type="date" value="${s.date}" max="${todayISO()}">
    <button class="btn btn-primary btn-block" style="margin-top:16px" data-ok>Save date</button>`, m=>{

      const v=$("#wd",m).value; if(!v){ toast("Pick a date"); return; }
      s.date=v; if(s.logId){ const lg=S().logs.find(l=>l.id===s.logId); if(lg) lg.date=v; }
      Store.save(); closeModal(); renderWorkout();
