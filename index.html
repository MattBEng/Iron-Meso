function editMeso(id){
  let m = id? mesoById(id) : null;
  const isNew=!m;
  if(isNew){
    // Create and persist immediately — every edit below autosaves,
    // so navigating away never loses work.
    m={id:uid(), name:"", weeks:5, deload:true, split:"Push Pull Legs",
      rampSets:true, startSets:2, endTargetSets:5, priority:{}, repeatRun:false,
      notes:"", days:SPLITS["Push Pull Legs"].map(n=>({id:uid(), name:n, exercises:[]}))};
    S().mesocycles.push(m);
    if(!S().activeMesoId) S().activeMesoId=m.id;
    Store.save(); Store.flush();
  }
  const autosave=()=>{ collectBasics(); Store.save(); };
  function render(){
    $("#view").innerHTML=`
      <div class="topbar"><button class="iconbtn" data-a="back" aria-label="Back">‹</button>
        <div style="flex:1;margin-left:10px"><h2>${isNew?`New ${term("meso")}`:`Edit ${term("meso")}`}</h2>
          <div class="faint">Saves automatically</div></div>
        <button class="btn btn-primary btn-sm" data-a="save">Done</button></div>
      <div class="card">
        <label>Name</label><input id="mname" value="${esc(m.name)}" placeholder="e.g. Hypertrophy Block 3">
        <div class="grid2">
          <div><label>Weeks</label><input id="mweeks" type="number" min="1" max="16" value="${m.weeks}"></div>
          <div><label>Split</label><select id="msplit">${Object.keys(SPLITS).map(s=>`<option ${m.split===s?"selected":""}>${s}</option>`).join("")}</select></div>
        </div>
        <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;margin-top:16px">
          <input type="checkbox" id="mdeload" style="width:22px;height:22px" ${m.deload?"checked":""}> Final week is a ${term("deload")}</label>
        <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;margin-top:12px">
          <input type="checkbox" id="mramp" style="width:22px;height:22px" ${m.rampSets?"checked":""}> Volume ramp — sets climb to a target over the ${term("meso")}</label>
        <div id="rampcfg" style="${m.rampSets?"":"display:none"}">
          <div class="grid2" style="margin-top:10px">
            <div><label>Start sets (week 1)</label><input id="mstart" type="number" min="1" max="10" value="${m.startSets??2}"></div>
            <div><label>End-week target sets</label><input id="mend" type="number" min="1" max="12" value="${m.endTargetSets??5}"></div>
          </div>
          <div class="kicker" style="margin-top:14px">Muscle priority</div>
          <p class="faint" style="margin:2px 0 8px">High = target · Normal = target−1 · Low (maintain) = target−2. Locked once the ${term("meso")} starts.</p>
          <div id="priolist"></div>
        </div>
        <label>${term("Meso")} notes</label><textarea id="mnotes" rows="2" placeholder="Goals, focus, cues…">${esc(m.notes||"")}</textarea>
      </div>
      <div class="row split" style="margin:6px 2px 10px"><h3>Training days</h3>
        <button class="btn btn-ghost btn-sm" data-a="addday">+ Day</button></div>
      <div id="days">${m.days.map((d,di)=>dayCard(d,di)).join("")}</div>
      <button class="btn btn-primary btn-block" data-a="save" style="margin-top:4px">Done</button>`;
    bindDayEvents();
    renderPriorities();
    // ramp config show/hide
    const ramp=$("#mramp");
    if(ramp) ramp.addEventListener("change", ()=>{ const c=$("#rampcfg"); if(c) c.style.display=ramp.checked?"":"none"; });
    // autosave on every field edit
    $$("#view input, #view select, #view textarea").forEach(el=>{
      el.addEventListener("input", autosave);
      el.addEventListener("change", autosave);
    });
  }
  function renderPriorities(){
    const host=$("#priolist"); if(!host) return;
    // muscles actually trained in this meso (non-cardio)
    const muscles=[...new Set(m.days.flatMap(d=>d.exercises
      .map(x=>exById(x.exerciseId)).filter(e=>e && e.muscle && e.muscle!=="Cardio").map(e=>e.muscle)))].sort();
    if(!muscles.length){ host.innerHTML=`<div class="faint">Add exercises to set muscle priorities.</div>`; return; }
    m.priority=m.priority||{};
    // Priorities are LOCKED once the meso has started (any logged workout), so the
    // volume ramp can't be moved under a block that's already in progress.
    const started=S().logs.some(l=>l.mesoId===m.id);
    host.innerHTML=(started?`<div class="faint" style="margin-bottom:8px">🔒 Locked — this ${term("meso")} has started.</div>`:"")
      + muscles.map(mg=>{
      const cur=m.priority[mg]||"normal";
      return `<div class="row split" style="margin-bottom:6px;align-items:center">
        <span style="font-weight:600">${mg}</span>
        <select data-prio="${mg}" style="width:130px" ${started?"disabled":""}>
          ${["high","normal","low"].map(p=>`<option value="${p}" ${cur===p?"selected":""}>${p==="high"?"High":p==="low"?"Low (maintain)":"Normal"}</option>`).join("")}
        </select></div>`;
    }).join("");
    // re-bind autosave to the new selects
    $$("[data-prio]").forEach(sel=>sel.addEventListener("change", autosave));
  }
  function dayCard(d,di){
    return `<div class="card" data-day="${di}">
      <div class="row split"><input value="${esc(d.name)}" data-dname="${di}" style="font-weight:800;background:transparent;border:0;padding:4px 0;font-size:17px">
        <button class="iconbtn" data-deld="${di}" aria-label="Remove day">✕</button></div>
      <div class="stack" data-exlist="${di}">
        ${d.exercises.map((x,xi)=>{
          const ex=exById(x.exerciseId);
          const cardio=x.cardio || isCardioEx(x.exerciseId);
          const meta=cardio? `${x.tabataOn&&x.tabata?`Tabata ${x.tabata.rounds}×${x.tabata.work}/${x.tabata.rest}s · `:""}${x.minutes||20} min${x.targetHR?` · target ${x.targetHR}bpm`:""}${x.notes?" · "+esc(x.notes):""}`
                           : `${x.warmup?"Warm-up · ":""}${x.sets}×${x.reps} · ${rirTxt(x.rir)} · rest ${x.rest}s${x.notes?" · "+esc(x.notes):""}`;
          return `<div class="setline dragrow" draggable="true" data-ex="${di}:${xi}">
            <span class="draghandle">⠿</span>
            <div class="grow" style="flex:1;min-width:0">
              <div>${cardio?"🫀 ":""}${esc(ex?ex.name:"?")}</div>
              <div class="faint num">${meta}</div></div>
            <button class="iconbtn" data-editx="${di}:${xi}" aria-label="Edit exercise targets">✎</button>
            <button class="iconbtn" data-delx="${di}:${xi}" aria-label="Remove exercise">✕</button></div>`;
        }).join("")}
      </div>
      <button class="btn btn-ghost btn-block btn-sm" style="margin-top:10px" data-addx="${di}">+ Add exercise</button>
    </div>`;
  }
  function collectBasics(){
    if(!$("#mname")) return;
    m.name=$("#mname").value.trim()||m.name||"Untitled block";
    m.weeks=clamp(parseInt($("#mweeks").value)||5,1,16);
    m.deload=$("#mdeload").checked;
    m.rampSets=$("#mramp")?.checked??false;
    if($("#mstart")) m.startSets=clamp(parseInt($("#mstart").value)||2,1,10);
    if($("#mend")) m.endTargetSets=clamp(parseInt($("#mend").value)||5,1,12);
    m.priority=m.priority||{};
    // skip disabled (locked) selects so a started meso keeps its priorities
    $$("[data-prio]").forEach(sel=>{ if(!sel.disabled) m.priority[sel.dataset.prio]=sel.value; });
    m.notes=$("#mnotes").value;
    $$("[data-dname]").forEach(inp=>m.days[+inp.dataset.dname].name=inp.value.trim()||"Day");
  }
  function bindDayEvents(){
    $("#msplit").onchange=e=>{
      collectBasics(); m.split=e.target.value;
      if(!m.days.some(d=>d.exercises.length))
        m.days=SPLITS[m.split].map(n=>({id:uid(),name:n,exercises:[]}));
      render();
    };
    // Drag and drop ordering — position is computed during dragover for the
    // visual indicator only; the array mutates once, on drop.
    let dragging=null;
    const clearMarks=()=>$$(".dragrow").forEach(r=>r.classList.remove("drop-before","drop-after"));
    $$(".dragrow").forEach(row=>{
      row.addEventListener("dragstart",e=>{
        dragging=row; row.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        try{ e.dataTransfer.setData("text/plain", row.dataset.ex); }catch(_){}
      });
      row.addEventListener("dragend",()=>{ row.classList.remove("dragging"); clearMarks(); dragging=null; });
      row.addEventListener("dragover",e=>{
        e.preventDefault();
        if(!dragging||dragging===row) return;
        if(dragging.dataset.ex.split(":")[0]!==row.dataset.ex.split(":")[0]) return; // same day only
        clearMarks();
        const before=e.offsetY < row.offsetHeight/2;
        row.classList.add(before?"drop-before":"drop-after");
      });
      row.addEventListener("drop",e=>{
        e.preventDefault();
        if(!dragging||dragging===row) return;
        const [sdi,sxi]=dragging.dataset.ex.split(":").map(Number);
        const [tdi,txi]=row.dataset.ex.split(":").map(Number);
        if(sdi!==tdi) return;
        const before=e.offsetY < row.offsetHeight/2;
        const arr=m.days[tdi].exercises;
        const [item]=arr.splice(sxi,1);
        let dest=txi + (before?0:1);
        if(sxi<txi) dest--;                  // account for removal shift
        arr.splice(clamp(dest,0,arr.length),0,item);
        collectBasics(); Store.save(); render();
      });
    });
    $("#view").onclick=e=>{
      const t=e.target.closest("[data-a],[data-addx],[data-editx],[data-delx],[data-deld]");
      if(!t) return;
      if(t.dataset.a==="back"||t.dataset.a==="save"){
        const nm=$("#mname")?.value.trim()||"";
        if(!nm){ toast(`Give the ${term("meso")} a name`); $("#mname")?.focus(); return; }
        if(nameExists(S().mesocycles, nm, m.id)){
          toast(`A ${term("meso")} with that name already exists`); $("#mname")?.focus(); return; }
        autosave(); toast(`${term("Meso")} saved`); go("mesos"); return;
      }
      if(t.dataset.a==="addday"){ collectBasics(); m.days.push({id:uid(),name:"Day "+(m.days.length+1),exercises:[]}); Store.save(); render(); return; }
      if(t.dataset.deld!=null){ collectBasics(); if(confirm("Remove this day?")){ m.days.splice(+t.dataset.deld,1); Store.save(); render(); } return; }
      if(t.dataset.addx!=null){ collectBasics(); const di=+t.dataset.addx; pickExercise(exId=>{
        const slot=isCardioEx(exId)
          ? {id:uid(), exerciseId:exId, cardio:true, minutes:20, targetHR:null, notes:""}
          : {id:uid(), exerciseId:exId, sets:3, reps:10, rir:2, rest:S().settings.restDefault, notes:""};
        m.days[di].exercises.push(slot);
        Store.save();
        // open the target editor right away so sets/reps are set intentionally
        if(!slot.cardio) editSlot(slot, ()=>{Store.save(); render();});
        else render();
      }); return; }
      if(t.dataset.delx!=null){ collectBasics(); const [di,xi]=t.dataset.delx.split(":").map(Number);
        m.days[di].exercises.splice(xi,1); Store.save(); render(); return; }
      if(t.dataset.editx!=null){ collectBasics(); const [di,xi]=t.dataset.editx.split(":").map(Number);
        editSlot(m.days[di].exercises[xi], ()=>{Store.save(); render();}); return; }
    };
  }
  render();
}
function editSlot(slot, done){
  const ex=exById(slot.exerciseId);
  const cardio=slot.cardio || isCardioEx(slot.exerciseId);
  if(cardio){
    const tb=slot.tabata||{};
    modal(`<h2>${FUN()?"🫀 ":""}${esc(ex.name)}</h2>
      <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px">
        <input type="checkbox" id="ctab" style="width:22px;height:22px" ${slot.tabataOn?"checked":""}> Tabata / intervals</label>
      <div id="tabfields" style="display:${slot.tabataOn?"block":"none"}">
        <div class="grid3">
          <div><label>Work (s)</label><input id="tw" type="number" min="5" value="${tb.work||20}"></div>
          <div><label>Rest (s)</label><input id="tr" type="number" min="0" value="${tb.rest??10}"></div>
          <div><label>Rounds</label><input id="tn" type="number" min="1" value="${tb.rounds||10}"></div>
        </div>
      </div>
      <div id="durfield" style="display:${slot.tabataOn?"none":"block"}">
        <label>Target minutes</label><input id="cm" type="number" min="1" value="${slot.minutes||20}"></div>
      <label>Target HR (optional)</label><input id="ch" type="number" min="60" max="220" value="${slot.targetHR||""}" placeholder="e.g. 140">
      <label>Notes</label><input id="sn" value="${esc(slot.notes||"")}" placeholder="Zone 2, easy pace…">
      <button class="btn btn-primary btn-block" style="margin-top:16px" data-ok>Done</button>`, mEl=>{
      $("#ctab",mEl).onchange=ev=>{ const on=ev.target.checked;
        $("#tabfields",mEl).style.display=on?"block":"none";
        $("#durfield",mEl).style.display=on?"none":"block"; };
      mEl.onclick=e=>{ if(!e.target.closest("[data-ok]")) return;
        slot.cardio=true;
        slot.tabataOn=$("#ctab",mEl).checked;
        if(slot.tabataOn){
          const work=clamp(+$("#tw",mEl).value||20,5,600), rest=clamp(+$("#tr",mEl).value||10,0,600), rounds=clamp(+$("#tn",mEl).value||10,1,100);
          slot.tabata={work,rest,rounds};
          slot.minutes=Math.max(1, Math.round(rounds*(work+rest)/60));
        } else {
          slot.tabata=null;
          slot.minutes=clamp(+$("#cm",mEl).value||20,1,600);
        }
        const th=parseInt($("#ch",mEl).value); slot.targetHR=(th>=60&&th<=220)?th:null;
        slot.notes=$("#sn",mEl).value;
        closeModal(); done();
      };
    });
    return;
  }
  const timed=!!ex.timed;
  modal(`<h2>${esc(ex.name)}</h2>
    <div class="grid3">
      <div><label>Sets</label><input id="ss" type="number" min="1" value="${slot.sets}"></div>
      ${timed
        ? `<div><label>Seconds</label><input id="sr" type="number" min="1" value="${slot.secs||30}"></div>`
        : `<div><label>Reps</label><input id="sr" type="number" min="1" value="${slot.reps}"></div>`}
      <div><label>${term("rirHead")}</label>${FUN()
        ? `<select id="si">${FEELS.map(([v,lb])=>`<option value="${v}" ${feelBucket(slot.rir)===v?"selected":""}>${lb}</option>`).join("")}</select>`
        : `<input id="si" type="number" min="0" max="5" value="${slot.rir}">`}</div>
    </div>
    <label>Rest (seconds)</label><input id="st" type="number" min="0" step="15" value="${slot.rest}">
    <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;margin-top:14px">
      <input type="checkbox" id="swu" style="width:22px;height:22px" ${slot.warmup?"checked":""}> All sets are warm-ups</label>
    <div class="faint" style="font-size:13px">Not counted in volume, stats or progression</div>
    <label>Notes</label><input id="sn" value="${esc(slot.notes||"")}" placeholder="${timed?"Tempo, cue…":"Tempo, grip, cue…"}">
    <button class="btn btn-primary btn-block" style="margin-top:16px" data-ok>Done</button>`, mEl=>{
    mEl.onclick=e=>{ if(!e.target.closest("[data-ok]")) return;
      slot.sets=clamp(+$("#ss",mEl).value||3,1,12);
      if(timed){ slot.secs=clamp(+$("#sr",mEl).value||30,1,3600); slot.reps=0; }
      else slot.reps=clamp(+$("#sr",mEl).value||10,1,50);
      slot.rir=clamp(+$("#si",mEl).value||0,0,5);
      slot.rest=clamp(+$("#st",mEl).value||120,0,900);
      slot.warmup=$("#swu",mEl).checked;
      slot.notes=$("#sn",mEl).value;
      closeModal(); done();
    };
  });
}
/** Reusable exercise picker with search + favourites + quick-create. */
function pickExercise(onPick){
  let filter="All";
  // groups present in the library, Cardio surfaced first, then the rest by frequency
  const present=[...new Set(S().exercises.map(e=>e.muscle))];
  const order=["Cardio",...MUSCLES.filter(m=>m!=="Cardio")].filter(m=>present.includes(m));
  const chips=["All",...order];
  function list(q=""){
    const ql=q.toLowerCase();
    return S().exercises
      .filter(e=>filter==="All" || e.muscle===filter)
      .filter(e=>!q || e.name.toLowerCase().includes(ql) || e.muscle.toLowerCase().includes(ql))
      .sort((a,b)=>(b.fav-a.fav)||a.muscle.localeCompare(b.muscle)||a.name.localeCompare(b.name));
  }
  const mEl=modal(`<h2>Choose exercise</h2>
    <div class="searchbar"><input id="q" placeholder="Search name or muscle…"></div>
    <div class="mgfilter" id="mgf">${chips.map(c=>`<button class="typechip ${c==="All"?"sel":""}" data-mg="${c}">${c}</button>`).join("")}</div>
    <div id="pl" style="max-height:46vh;overflow:auto;margin-top:6px"></div>
    <button class="btn btn-ghost btn-block" style="margin-top:10px" data-new>+ Create custom exercise</button>`, box=>{
    const draw=()=>{ $("#pl",box).innerHTML=list($("#q",box).value).map(e=>
      `<div class="listitem" data-pick="${e.id}" style="padding:10px 12px;margin-bottom:8px">
        <div class="grow"><div class="title">${e.fav?"★ ":""}${e.cardio?"🫀 ":""}${esc(e.name)}</div>
        <div class="tag-mg">${e.muscle} · ${e.equipment}</div></div></div>`).join("")||`<div class="empty">Nothing found</div>`; };
    draw();
    $("#q",box).oninput=draw; $("#q",box).focus();
    box.onclick=e=>{
      const mg=e.target.closest("[data-mg]");
      if(mg){ filter=mg.dataset.mg; $$("#mgf .typechip",box).forEach(c=>c.classList.toggle("sel",c===mg)); draw(); return; }
      const p=e.target.closest("[data-pick]");
      if(p){ closeModal(); onPick(p.dataset.pick); }
      if(e.target.closest("[data-new]")){ closeModal(); editExercise(null, id=>onPick(id)); }
    };
  });
}

/* ================= VIEW: EXERCISE DATABASE ================= */
VIEWS.exercises=function(){
  function draw(q=""){
    const ql=q.toLowerCase();
    const groups={};
    S().exercises.filter(e=>!q||e.name.toLowerCase().includes(ql)||e.muscle.toLowerCase().includes(ql))
      .forEach(e=>(groups[e.muscle]??=[]).push(e));
    $("#exl").innerHTML=Object.keys(groups).sort().map(mg=>`
      <div class="kicker" style="margin:14px 2px 8px">${mg}</div>
      ${groups[mg].sort((a,b)=>(b.fav-a.fav)||a.name.localeCompare(b.name)).map(e=>{
        const pr=exercisePR(e.id);
        return `<div class="listitem" data-open="${e.id}">
          <button class="iconbtn" data-fav="${e.id}" style="border:0;background:none;font-size:20px;color:${e.fav?"var(--amber)":"var(--faint)"}">${e.fav?"★":"☆"}</button>
          <div class="grow"><div class="title">${esc(e.name)}${e.builtin?"":" <span class='pill'>custom</span>"}</div>
            <div class="faint num">${e.equipment}${pr?` · PR ${dispW(pr.best.kg)}${unitLabel()}×${pr.best.reps} (e1RM ${dispW(pr.e1rm)})`:""}</div></div>
          <span class="faint">›</span></div>`;
      }).join("")}`).join("")||`<div class="empty">Nothing found</div>`;
  }
  $("#view").innerHTML=`
    <div class="topbar"><h1>Exercises</h1>
      <button class="btn btn-primary btn-sm" data-new>+ New</button></div>
    <div class="searchbar"><input id="q" placeholder="Search…"></div>
    <div id="exl"></div>`;
  draw();
  $("#q").oninput=e=>draw(e.target.value);
  $("#view").onclick=e=>{
    const fav=e.target.closest("[data-fav]");
    if(fav){ const ex=exById(fav.dataset.fav); ex.fav=!ex.fav; Store.save(); draw($("#q").value); return; }
    if(e.target.closest("[data-new]")){ editExercise(null, ()=>go("exercises")); return; }
    const open=e.target.closest("[data-open]");
    if(open) go("history", open.dataset.open);
  };
};
function editExercise(id, done){
  const ex = id? exById(id) : {id:"c_"+uid(), name:"", muscle:"Chest", equipment:"Barbell", notes:"", builtin:false, fav:false};
  modal(`<h2>${id?"Edit":"New"} exercise</h2>
    <label>Name</label><input id="en" value="${esc(ex.name)}" placeholder="e.g. Larsen Press">
    <div class="grid2">
      <div><label>Muscle group</label><select id="em">${MUSCLES.map(m=>`<option ${ex.muscle===m?"selected":""}>${m}</option>`).join("")}</select></div>
      <div><label>Equipment</label><select id="ee">${EQUIP.map(m=>`<option ${ex.equipment===m?"selected":""}>${m}</option>`).join("")}</select></div>
    </div>
    <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;margin-top:14px">
      <input type="checkbox" id="eassist" style="width:22px;height:22px" ${ex.assisted?"checked":""}>
      Assisted (more weight = easier, e.g. assisted pull-up)</label>
    <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;margin-top:10px">
      <input type="checkbox" id="etime" style="width:22px;height:22px" ${ex.timed?"checked":""}>
      Time-based hold (log seconds, e.g. plank, dead hang)</label>
    <label>Smallest weight jump (${unitLabel()})</label>
    <input id="estep" type="number" inputmode="decimal" step="any" min="0.25"
      value="${ex.step? dispW2(ex.step) : ""}" placeholder="${dispW2(DEFAULT_STEP[ex.equipment]??2.5)} (default for ${esc(ex.equipment||"this")})">
    <p class="faint" style="margin:4px 0 0">The next weight you can actually load. Drives how many reps
      you build up to before adding weight — a big jump (5→7.5kg dumbbell) needs more reps banked first.</p>
    <label>Notes</label><textarea id="eno" rows="2">${esc(ex.notes||"")}</textarea>
    <button class="btn btn-primary btn-block" style="margin-top:16px" data-ok>Save exercise</button>`, m=>{
    $("#en",m).focus();
    m.onclick=e=>{ if(!e.target.closest("[data-ok]")) return;
      const name=$("#en",m).value.trim();
      if(!name){ toast("Exercise name is required"); $("#en",m).focus(); return; }
      if(nameExists(S().exercises, name, ex.id)){
        toast("An exercise with that name already exists"); $("#en",m).focus(); return; }
      ex.name=name;
      ex.muscle=$("#em",m).value; ex.equipment=$("#ee",m).value; ex.notes=$("#eno",m).value;
      ex.assisted=$("#eassist",m).checked;
      ex.timed=$("#etime",m).checked;
      { const sv=parseFloat($("#estep",m).value);
        // the field is shown in the user's unit; only re-convert when they
        // actually changed it, or a round trip would shrink it every save
        const shown=ex.step? dispW2(ex.step) : null;
        if(isFinite(sv)&&sv>0){ if(shown===null || Math.abs(sv-shown)>0.001) ex.step=Math.round(toKg(sv)*100)/100; }
        else delete ex.step; }
      if(ex.timed) ex.assisted=false;   // mutually exclusive with assisted-weight logic
      if(!id) S().exercises.push(ex);
      Store.save(); closeModal(); done(ex.id);
    };
  });
}

/* ================= VIEW: WORKOUT (core screen) =================
   RP-style layout: every exercise visible in one scrollable list,
   one editable row per set, tap the check to log. */
let restInterval=null;

/** Build pre-filled set rows for a session exercise. */
function buildTimedRows(count, secs, rir){
  return Array.from({length:count}, ()=>({kg:0, reps:0, secs, rir, expSecs:secs, done:false, touched:false, at:null}));
}
function buildSetRows(count, kg, reps, rir){
  return Array.from({length:count},()=>({kg, reps, rir, expReps:reps, done:false, at:null}));
}
/**
 * Per-set rep expectations, RP-style: each set's ghost comes from last week's
 * same-numbered set at the working weight, so natural fatigue drop-off
 * (14/13/12) is planned rather than punished.
 *  - weight went UP   -> match last week's reps per set at the heavier load
 *  - weight REPEATED  -> beat last week by one rep per set
 *  - backoff/deload   -> flat target reps
 */
/* Ghost (expected) reps for the coming session.
   Two mutually exclusive routes — never both at once:
     - weight HELD  -> add a rep to each set (double progression)
     - weight RAISED -> carry the same effort to the new load, which means
                        FEWER reps, predicted from the load–rep model.
   Asking for more weight AND the same reps is a double increase; that was the
   old behaviour and it is too aggressive. */
function buildGhostRows(exId, count, kg, targetReps, rir, sug, deload){
  if(!sug || deload || sug.kg<sug.lastKg) return buildSetRows(count, kg, targetReps, rir);
  const hist=exerciseHistory(exId);
  const work=hist.length? hist[0].sets.filter(s=>s.kg===sug.lastKg && (!s.type||s.type==="normal")):[];
  const heldWeight = sug.kg===sug.lastKg;
  /* A NEW block re-prescribes the exercise. Carrying last block's rep count
     forward would show 17 under a "target 10" header: the old 16-rep history is
     a different prescription, not progress against this one. So reps restart at
     the slot's target until this meso has logged the exercise itself; the LOAD
     still carries over via the suggestion. Within a block, history keeps
     driving rep progression as before. */
  const curMeso=S().activeMesoId;
  const freshBlock = !!curMeso && hist.length
    && hist.every(x=>x.mesoId && x.mesoId!==curMeso);
  return Array.from({length:count},(_,i)=>{
    if(freshBlock) return {kg, reps:targetReps, rir, expReps:targetReps, done:false, at:null};
    const base=work.length? work[Math.min(i,work.length-1)].reps : targetReps;
    let reps;
    if(heldWeight) reps = sug.repeatReps? base : base+1;      // same load -> one more rep (unless repeating)
    else {
      const pred=repsAtLoad(sug.lastKg, base, kg);           // heavier -> fewer reps
      reps = pred!==null? pred : Math.max(1, base-Math.round(base*0.15));
    }
    reps=Math.max(1, reps);
    return {kg, reps, rir, expReps:reps, done:false, at:null};
  });
}
/** Older sessions stored steppers + a grow-only sets array; upgrade in place. */
/* Point a session exercise at a different exercise (Replace exercise, or a
   library edit that changed what it is). Set count, RIR, rest and notes carry
   over; everything DERIVED from the exercise has to be rebuilt — bodyweight
   rows, timed holds, the cardio card, the load suggestion — or a dumbbell
   movement inherits the "BW" rows of the push-ups it replaced. */
function retargetSessionExercise(ses, newId, edit){
  const ex=exById(newId);
  const n=Math.max(1, (ses.sets&&ses.sets.length) || ses.target?.sets || 3);
  const rir=ses.target?.rir ?? 2;
  const rest=ses.target?.rest ?? S().settings.restDefault;
  const notes=ses.target?.notes || "";
  const keptReps=ses.target?.reps || 10;
  ses.exerciseId=newId;
  ses.holdWeight=false;
  delete ses.bodyweight; delete ses.band; delete ses.timed; delete ses.cardio;
  delete ses.log; delete ses.done; delete ses.cardioId;
  if(isCardioEx(newId)){
    ses.cardio=true; ses.done=false; ses.sets=[]; ses.suggestion=null;
    ses.target={minutes:20, targetHR:null, notes, tabataOn:false, tabata:null};
    ses.log={minutes:20, avgHR:null, distanceKm:null, level:null, speed:null, incline:null};
    return ses;
  }
  if(ex && ex.timed){
    const secs=ses.target?.secs || 30;
    ses.timed=true; ses.bodyweight=!!(ex.equipment==="Bodyweight"); ses.suggestion=null;
    ses.target={sets:n, reps:0, rir, rest, notes, secs};
    ses.sets=buildTimedRows(n, secs, rir);
    return ses;
  }
  const sug=edit? null : ProgressionEngine.suggest(newId, keptReps, rir);
  const isBW=repsOnly(ex);
  const reps=(sug && sug.bodyweight)? sug.reps : keptReps;
  ses.bodyweight=isBW; ses.band=isBandEx(ex); ses.timed=false; ses.suggestion=sug;
  ses.target={sets:n, reps, rir, rest, notes};
  ses.sets= isBW? buildSetRows(n, 0, reps, rir)
                : buildGhostRows(newId, n, sug? sug.kg : 0, reps, rir, sug, false);
  return ses;
}
/** Deload load for one exercise: ~60% of last time. Assisted lifts keep last
    time's assistance (60% of the assistance would make the lift HARDER). */
function deloadKg(sug, ex){
  if(ex && ex.assisted) return sug.lastKg;
  return snapLoad(sug.lastKg*0.6, sug.lastKg, ex);
}
function upgradeSession(s){
  s.exercises.forEach(e=>{
    // backfill bodyweight flag from the library (handles exercises added/edited
    // to Bodyweight after this session was first built)
    if(e.bodyweight===undefined && !e.cardio){
      const ex=exById(e.exerciseId);
      e.bodyweight = repsOnly(ex);
    }
    if(e.timed===undefined && !e.cardio){
      const ex=exById(e.exerciseId);
      e.timed = !!(ex && ex.timed);
    }
    // Flags that disagree with the library (a swap done before this was fixed,
    // or the exercise edited since) — rebuild, unless sets are already logged.
    const lib=exById(e.exerciseId);
    if(lib){
      const wantCardio=isCardioEx(e.exerciseId);
      const wantTimed=!e.cardio && !!lib.timed;
      const wantBW=!e.cardio && repsOnly(lib);
      const mismatch = (!!e.cardio!==wantCardio) || (!e.cardio && (!!e.timed!==wantTimed || !!e.bodyweight!==wantBW));
      if(mismatch && !(e.sets||[]).some(x=>x.done) && !e.done)
        retargetSessionExercise(e, e.exerciseId, !!e._edit);
      if(!e.cardio){ e.band=isBandEx(lib); if(e.band) fillBands(e); }
    }
    if(e.rowsReady) return;
    const done=(e.sets||[]).map(x=>({...x, done:true}));
    const kg=e.curKg ?? (e.suggestion? e.suggestion.kg:0);
    const remaining=Math.max(0, e.target.sets-done.length);
    e.sets=[...done, ...buildSetRows(remaining, kg, e.curReps??e.target.reps, e.curRIR??e.target.rir)];
    e.rowsReady=true;
  });
}

VIEWS.workout=function(){
  const st=S();
  if(st.editSession){ renderWorkout(); return; }   // editing a past workout takes precedence
  if(!st.activeSession){
    const meso=activeMeso();
    if(!meso){ $("#view").innerHTML=`<div class="topbar"><h1>Train</h1></div>
      <div class="empty">No active ${term("meso")}.<br><br><button class="btn btn-primary" onclick="go('mesos','new')">Create one</button></div>`; return; }
    const pos=mesoPosition(meso);
    if(!pos.day){ $("#view").innerHTML=`<div class="topbar"><h1>Train</h1></div>
      <div class="empty">This ${term("meso")} has no training days yet.<br><br><button class="btn btn-primary" onclick="go('mesos')">Edit</button></div>`; return; }
    if(pos.finished){ renderMesoComplete(meso, pos); return; }
    const deload=isDeload(meso,pos.week);
    st.activeSession={
      id:uid(), mesoId:meso.id, week:pos.week, dayIdx:pos.dayIdx, dayId:pos.day.id, dayName:pos.day.name,
      mesoName:meso.name, date:todayISO(), startedAt:Date.now(), notes:"", deload,
      exercises:pos.day.exercises.map(slot=>{
        if(slot.cardio || isCardioEx(slot.exerciseId)){
          // cardio item: duration + HR, logged into the cardio store on finish
          return {slotId:slot.id, exerciseId:slot.exerciseId, cardio:true,
            target:{minutes:slot.minutes||20, targetHR:slot.targetHR||null, notes:slot.notes||"",
              tabataOn:!!slot.tabataOn, tabata:slot.tabata||null},
            notes:"", skipped:false, rowsReady:true, done:false,
            log:{minutes:slot.minutes||20, avgHR:null, distanceKm:null, level:null, speed:null, incline:null}, sets:[]};
        }
        const sug=ProgressionEngine.suggest(slot.exerciseId, slot.reps, slot.rir);
        const exRef=exById(slot.exerciseId);
        const isBW = repsOnly(exRef);
        const isTimed = !!(exRef && exRef.timed);
        let kg=sug? sug.kg : 0;
        // reps target: bodyweight uses the engine's rep suggestion, else the slot's
        const repTarget = (sug && sug.bodyweight)? sug.reps : slot.reps;
        // volume ramp (per-exercise, per-muscle ceiling, lands in final real week)
        // warm-up slots keep their own set count: no ramp, no deload halving
        let nSets=slot.warmup? slot.sets : rampedSets(meso, slot, pos.week, deload);
        if(deload && sug && !isBW){ kg=deloadKg(sug, exRef); }
        return {slotId:slot.id, exerciseId:slot.exerciseId, bodyweight:isBW, band:isBandEx(exRef), warmup:!!slot.warmup, timed:isTimed,
          target:{sets:nSets, reps:repTarget, rir:slot.rir, rest:slot.rest, notes:slot.notes,
            secs: isTimed? (slot.secs||30) : undefined},
          suggestion: isTimed? null : (deload&&sug&&!isBW? {...sug, kg, diff:kg-sug.lastKg, reason:FUN()?"Recovery week — lighter and shorter on purpose.":(exRef&&exRef.assisted?"Deload — same assistance as last time, half the sets.":"Deload — ~60% load, half the sets.")} : sug),
          notes:"", skipped:false, rowsReady:true,
          sets: warmRows(isTimed? buildTimedRows(nSets, slot.secs||30, slot.rir)
                : isBW? buildSetRows(nSets, 0, repTarget, slot.rir)
                    : buildGhostRows(slot.exerciseId, nSets, kg, slot.reps, slot.rir, sug, deload), slot.warmup)};
      })
    };
    Store.save(); Store.flush();
  }
  upgradeSession(st.activeSession);
  renderWorkout();
};

function sessionTotals(s){
  const active=s.exercises.filter(e=>!e.skipped);
  const total=active.reduce((t,e)=>t+(e.cardio?1:e.sets.length),0);
  const done=active.reduce((t,e)=>t+(e.cardio?(e.done?1:0):e.sets.filter(x=>x.done).length),0);
  return {total, done};
}

const SET_TYPES={
  normal: {badge:"",   label:"Regular",       desc:"Straight set"},
  amrap:  {badge:"AMRAP", label:"AMRAP",       desc:"As many reps as possible on the last set"},
  my:     {badge:"MY",  label:"Myorep",        desc:"Rest-pause: short rests, extra mini-sets to failure"},
  mm:     {badge:"MM",  label:"Myorep Match",  desc:"Match the myorep count across clusters"},
  warmup: {badge:"W",   label:"Warm-up",       desc:"Lighter prep set — not counted in volume, stats or progression"},
};
/* Warm-ups are logged so you can see them, but they are prep, not training:
   they never count toward volume, sets, PRs, e1RM or the progression engine.
   The engine already only reads type "normal" sets; everything that totals
   training filters through isWarm(). */
const isWarm=s=>!!s && s.type==="warmup";
function setTypeBadge(t){ const d=SET_TYPES[t]; return (d&&d.badge)? `<span class="settype-badge" data-tt="${t}">${d.badge}</span>` : ""; }

/** Update the rep placeholders/hints after a live weight change. */
function repaintPred(xi){
  const s=S().editSession||S().activeSession; if(!s) return;
  const ses=s.exercises[xi]; if(!ses) return;
  ses.sets.forEach((x,si)=>{
    const cell=document.querySelector(`[data-f="reps"][data-set="${xi}:${si}"]`);
    if(!cell) return;
    const entered = x.done || x.touched;            // never disturb a set the user has filled in
    if(x.predReps===null){
      cell.placeholder="??";
      cell.classList.toggle("pred-unknown", !entered);
    } else {

/* The sets you did last time this exercise came up, from the raw logs (warm-ups
   included, so a warm-up row can show last warm-up). While editing a past
   workout, "last time" means the session before that one. */
function prevSessionSets(exId){
  const cur=S().editSession||S().activeSession;
  const editing=!!S().editSession;
  const logs=S().logs.filter(l=>!l.skipped && (!editing || (l.id!==cur.id && l.date<=cur.date)));
  for(let i=logs.length-1;i>=0;i--){
    const e=logs[i].exercises.find(e=>e.exerciseId===exId);
    const done=e && (e.sets||[]).filter(s=>s.done);
    if(done && done.length) return done;
  }
  return null;
}
/** "last 60×12" hint under a row: matched warm-up-to-warm-up and
    working-to-working by position, so adding a warm-up doesn't shift it. */
function lastHintHTML(ses, x, si, prev){
  if(!prev) return "";
  const warm=isWarm(x);
  const pos=ses.sets.slice(0,si).filter(r=>isWarm(r)===warm).length;
  const p=prev.filter(r=>isWarm(r)===warm)[pos];
  if(!p) return `<div class="lasthint"></div>`;
  const txt = ses.timed ? `${p.secs??"?"}s`
            : ses.band ? `${p.band||"band"} ×${p.reps}`
            : ses.bodyweight && !p.kg ? `×${p.reps}`
            : `${dispW(p.kg)}×${p.reps}`;
  return `<div class="lasthint num">last ${txt}${p.type&&p.type!=="normal"?` ${SET_TYPES[p.type]?.badge||""}`:""}</div>`;

/* Marking a set as (or no longer) a warm-up shifts which rows are working sets.
   Re-aim the untouched working rows so working set 1 is prescribed from last
   time's working set 1, not from whatever sat in that row before. */
function realignWorkingGhosts(ses){
  if(ses.timed || ses.cardio || !ses.suggestion) return;
  const working=ses.sets.filter(r=>!isWarm(r));
  if(!working.length) return;
  const t=ses.target, sug=ses.suggestion;
  const fresh=buildGhostRows(ses.exerciseId, working.length, sug.kg, t.reps, t.rir, sug, false);
  working.forEach((r,i)=>{ if(r.done || r.touched || !fresh[i]) return;
    r.reps=fresh[i].reps; r.expReps=fresh[i].expReps; });
}
/** Warm-up slots: every row starts as a Warm-up set (W badge, not counted). */
function warmRows(rows, on){ if(on) rows.forEach(r=>{ r.type="warmup"; }); return rows; }
/* Band rows start on the band used last time (same warm-up/working position),
   else the last band used, else the row above, else the lightest. */
function fillBands(ses){
  const prev=prevSessionSets(ses.exerciseId)||[];
  const lastBand=[...prev].reverse().find(p=>p.band)?.band;
  ses.sets.forEach((x,si)=>{
    if(x.band) return;
    const warm=isWarm(x);
    const pos=ses.sets.slice(0,si).filter(r=>isWarm(r)===warm).length;
    const p=prev.filter(r=>isWarm(r)===warm)[pos];
    x.band=(p&&p.band) || lastBand || (si>0 && ses.sets[si-1].band) || BANDS[0][0];
  });
}

/* "Can't add weight" → keep the current (last) weight and progress by reps.
   Rep target = beat last session's reps by 1, capped at target+4 (the ceiling,
   above which the engine will push weight again). Re-decided from history next
   session, so there's no sticky flag to get out of sync. */
const REP_CEILING_OVER_TARGET=4;
/** "Can't drop the weight" — the easier load isn't available (a stack that only
    goes in 5s, dumbbells that jump 2.5). Keep the weight and rebuild by reps:
    aim for the reps they actually completed on every set. */
function holdWeightRepBackoff(xi){
  const s=S().editSession||S().activeSession, ses=s.exercises[xi];
  const sug=ses.suggestion; if(!sug) return;
  const holdKg=sug.lastKg;
  const hist=progHistory(ses.exerciseId);
  const lastWork=hist.length? hist[0].sets.filter(x=>x.kg===holdKg && (!x.type||x.type==="normal")) : [];
  // the rep count they managed on EVERY set, so the session is completable
  const repTarget=Math.max(1, lastWork.length? Math.min(...lastWork.map(x=>x.reps)) : ses.target.reps-1);
  ses.holdWeight=true;
  ses.suggestion={...sug, repTarget, kg:holdKg, diff:0,
    reason:`Holding ${dispW(holdKg)}${unitLabel()} — aim for ${repTarget} reps on every set.`};
  ses.sets=ses.sets.map(row=>({kg:holdKg, reps:repTarget, rir:ses.target.rir,
    expReps:repTarget, done:false, at:null, type:row.type||null}));
  Store.save();
  renderWorkout();
}
function holdWeightRepProgress(xi){
  const s=S().editSession||S().activeSession, ses=s.exercises[xi];
  const sug=ses.suggestion; if(!sug) return;
  const holdKg=sug.lastKg;
  // last session's reps at the working weight
  const hist=progHistory(ses.exerciseId);
  const lastWork=hist.length? hist[0].sets.filter(x=>x.kg===holdKg && (!x.type||x.type==="normal")) : [];
  const lastReps=lastWork.length? Math.max(...lastWork.map(x=>x.reps)) : ses.target.reps;
  // The user has explicitly said the next weight ISN'T available, so the normal
  // "stop repping, add weight" ceiling must not clamp them below what they just
  // did — always allow at least one more rep than last time.
  const ceiling=Math.max(repCeilingFor(exById(ses.exerciseId), holdKg, ses.target.reps), lastReps+1);
  const repTarget=Math.min(ceiling, lastReps+1);
  ses.holdWeight=true;
  ses.suggestion={...sug, repTarget, kg:holdKg, diff:0,
    reason:`Holding ${dispW(holdKg)}${unitLabel()} — aim for ${repTarget} reps.`};
  // rebuild rows: all sets at holdKg, ghost reps = repTarget
  ses.sets=ses.sets.map((row,i)=>({kg:holdKg, reps:repTarget, rir:ses.target.rir,
    expReps:repTarget, done:false, at:null, type:row.type||null}));
  Store.save(); 
  const fn=window.refreshCard || null;
  renderWorkout();
}
/* What you see when a mesocycle finishes.
   Closing the loop: what the block actually produced, then the three things you
   might want to do next (repeat it, start something new, archive it). */
/* Start a fresh run of an existing mesocycle.
   The copy carries structure, priorities, rep ranges and ramp settings, and is
   flagged repeatRun so the volume ramp starts at week-2 level — you're already
   adapted, so there's no reason to redo the easiest week. Loads carry forward
   through the progression engine, which reads history by exercise. */
function repeatMeso(id){
  const m=S().mesocycles.find(x=>x.id===id); if(!m) return;
  const c=JSON.parse(JSON.stringify(m));
  c.id=uid();
  const runN=(m.name.match(/run (\d+)/)||[])[1];
  c.name=m.name.replace(/ \(run \d+\)$/,"") + ` (run ${runN? +runN+1 : 2})`;
  c.days.forEach(d=>{ d.id=uid(); d.exercises.forEach(x=>x.id=uid()); });
  c.archived=false;
  c.repeatRun=true;
  m.archived=true;                       // the finished run steps aside
  S().mesocycles.push(c);
  S().activeMesoId=c.id;
  S().activeSession=null;
  S().parkedSession=null;
  Store.save(); Store.flush();
  toast(FUN()?"Round two — starting at week-2 volume 💪":"Repeating — starts at week-2 volume");
  go("workout");
}
function mesoSummary(meso){
  const logs=S().logs.filter(l=>(l.mesoId===meso.id || l.bonusOf===meso.id) && !l.skipped);
  const skipped=S().logs.filter(l=>l.mesoId===meso.id && l.skipped).length;
  const cardio=S().cardio.filter(c=>c.mesoId===meso.id);
  const pos=mesoPosition(meso);
  const t={workouts:logs.length, sets:0, reps:0, vol:0, mins:0,
           cardioMin:cardio.reduce((a,c)=>a+(c.minutes||0),0), skipped};
  const byWeek={}, perMuscle={};
  logs.forEach(l=>{
    t.mins+=l.durationMin||0;
    const wk=(byWeek[l.week]??={vol:0,sets:0});
    l.exercises.forEach(e=>{
      const ex=exById(e.exerciseId);
      e.sets.filter(s=>s.done && !isWarm(s)).forEach(s=>{
        t.sets++; t.reps+=s.reps||0;
        const v=(s.kg||0)*(s.reps||0);
        t.vol+=v; wk.vol+=v; wk.sets++;
        if(ex && ex.muscle!=="Cardio") perMuscle[ex.muscle]=(perMuscle[ex.muscle]||0)+1;
      });
    });
  });
  const wks=Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  const first=wks.length? byWeek[wks[0]] : null;
  const last =wks.length? byWeek[wks[wks.length-1]] : null;
  // Compare the first REAL week with the last non-deload week, so a deload
  // doesn't read as "you got weaker".
  const lastReal=wks.filter(w=>!isDeload(meso,w)).pop();
  const lastRealW=lastReal!=null? byWeek[lastReal] : last;
  const volDelta=(first && lastRealW && first.vol>0)
    ? Math.round(100*(lastRealW.vol-first.vol)/first.vol) : null;
  const setDelta=(first && lastRealW)? lastRealW.sets-first.sets : null;
  // PRs set during the block
  const prs=[];
  const start=logs.length? logs[0].date : null;
  if(start){
    const seen=new Set();
    logs.forEach(l=>l.exercises.forEach(e=>seen.add(e.exerciseId)));
    seen.forEach(id=>{
      const hist=exerciseHistory(id);
      const inside=hist.filter(x=>x.date>=start), before=hist.filter(x=>x.date<start);
      if(!inside.length || !before.length) return;
      const best=Math.max(...inside.map(x=>x.e1rm)), prev=Math.max(...before.map(x=>x.e1rm));
      if(best>prev && prev>0) prs.push({name:exById(id)?.name||"?", from:prev, to:best});
    });
    prs.sort((a,b)=>(b.to-b.from)-(a.to-a.from));
  }
  return {t, prs, volDelta, setDelta, perMuscle, pos,
          start, end: logs.length? logs[logs.length-1].date : null,
          adherence: pos.total? Math.round(100*pos.done/pos.total) : null};
}

      rows+=`<div class="listitem" data-cur style="padding:10px 14px;margin-bottom:8px;border-color:var(--accent)">
        <div class="grow"><div class="title num">W${wk} · ${esc(day.name)}</div>
        <div class="faint">Current workout</div></div><span class="pill acc">Now</span></div>`;
    } else if(i>logs.length && i<=logs.length+5){   // next 5 upcoming only
      rows+=`<div class="listitem" data-pv="${di}" data-pw="${wk}" style="padding:10px 14px;margin-bottom:8px;opacity:.55">
        <div class="grow"><div class="title num">W${wk} · ${esc(day.name)}</div>
        <div class="faint">Upcoming — tap to preview</div></div><span class="pill">🔒</span></div>`;
    }
  }
  modal(`<h2>${esc(meso.name)}</h2>
    <p class="muted">Tap a past workout to edit it — add anything you forgot. Your current workout is untouched.</p>
    <div style="max-height:60vh;overflow:auto;margin-top:10px">${rows}</div>`, m=>{
    m.onclick=e=>{
      const pv=e.target.closest("[data-pv]");
      if(pv){ closeModal(); startFuturePreview(+pv.dataset.pw, +pv.dataset.pv); return; }
      const dl=e.target.closest("[data-dellog]");
      if(dl){ closeModal(); confirmDeleteLog(dl.dataset.dellog); return; }
      const el=e.target.closest("[data-editlog]");
      if(el){ closeModal(); startLogEdit(el.dataset.editlog); return; }
      if(e.target.closest("[data-cur]")){
        closeModal();
        if(S().editSession){ S().editSession=null; Store.save(); }
        go("workout");
      }
    };
  });
}

/** Open a completed log in the workout UI for editing; changes write back on Save. */
function startLogEdit(logId, forceReadonly){
  const log=S().logs.find(l=>l.id===logId);
  if(!log) return;
  const meso=mesoById(log.mesoId);
  const idx=S().logs.filter(l=>l.mesoId===log.mesoId).indexOf(log);
  const readonly=forceReadonly || !logEditable(log);
  // Lifting exercises come from the log; cardio comes from the cardio store for
  // this workout's date (that's where in-workout cardio was saved), so editing
  // a past workout shows — and can change — its cardio too.
  const liftEx=log.exercises.map(e=>({slotId:null, exerciseId:e.exerciseId,
    target:e.target||{sets:e.sets.length,reps:10,rir:2,rest:0,notes:""},
    suggestion:null, notes:e.notes||"", skipped:false, rowsReady:true, _edit:true,
    sets:(e.sets||[]).map(x=>({...x, expReps:x.expReps??x.reps,
      done:true, touched:true, at:x.at||null}))}));
  const dayCardio=S().cardio.filter(c=>c.date===log.date && c.mesoId===log.mesoId && c.fromWorkout);
  const cardioEx=dayCardio.map(c=>{
    const exId=(S().exercises.find(e=>e.name===c.type)||{}).id || null;
    return {slotId:null, exerciseId:exId, cardio:true, cardioId:c.id,
      target:{minutes:c.minutes, targetHR:null, notes:""},
      notes:c.notes||"", skipped:false, rowsReady:true, done:true, _edit:true,
      log:{minutes:c.minutes, avgHR:c.avgHR, distanceKm:c.distanceKm, level:c.level, speed:c.speed, incline:c.incline},
      _cardioName:c.type, sets:[]};
  });
  S().editSession={
    mode:"edit", readonly, logId:log.id, mesoId:log.mesoId, week:log.week,
    dayId:log.dayId,
    dayIdx:meso? idx%Math.max(1,meso.days.length):0,
    dayName:log.dayName, mesoName:meso?meso.name:"", date:log.date,
    startedAt:Date.now(), notes:log.notes||"", deload:false,
    exercises:[...liftEx, ...cardioEx]
  };
  // keep warm-up / AMRAP / myorep types and hold seconds (whole set copied above),
  // and set the bodyweight / timed flags so the rows render correctly.
  upgradeSession(S().editSession);
  Store.save();
  go("workout");
}
/** Open a FUTURE planned workout (from the meso template) as a full read-only
    view with projected weights. */
function startFuturePreview(week, dayIdx){
  const meso=activeMeso(); if(!meso) return;
  const day=meso.days[dayIdx]; if(!day) return;
  const deload=isDeload(meso, week);
  S().editSession={
    mode:"edit", readonly:true, future:true, logId:null, mesoId:meso.id, week,
    dayId:day.id, dayIdx, dayName:day.name, mesoName:meso.name,
    date:null, startedAt:Date.now(), notes:day.notes||"", deload,
    exercises:day.exercises.map(slot=>{
      if(slot.cardio || isCardioEx(slot.exerciseId))
        return {slotId:slot.id, exerciseId:slot.exerciseId, cardio:true,
          target:{minutes:slot.minutes||20, targetHR:slot.targetHR||null, notes:slot.notes||""},
          notes:"", skipped:false, rowsReady:true, done:false,
          log:{minutes:slot.minutes||20, avgHR:null, distanceKm:null}, sets:[]};
      const sug=ProgressionEngine.suggest(slot.exerciseId, slot.reps, slot.rir);
      let kg=sug?sug.kg:0;
      let nSets=rampedSets(meso, slot, week, deload);
      if(deload && sug){ kg=deloadKg(sug, exById(slot.exerciseId)); }
      return {slotId:slot.id, exerciseId:slot.exerciseId,
        target:{sets:nSets, reps:slot.reps, rir:slot.rir, rest:slot.rest, notes:slot.notes},
        suggestion:sug, notes:"", skipped:false, rowsReady:true, _edit:false,
        sets:buildGhostRows(slot.exerciseId, nSets, kg, slot.reps, slot.rir, sug, deload)};
    })
  };
  Store.save();
  go("workout");
}

      const v=$("#wd",m).value; if(!v){ toast("Pick a date"); return; }
      s.date=v; if(s.logId){ const lg=S().logs.find(l=>l.id===s.logId); if(lg) lg.date=v; }

/** Ask for the real elapsed time. `guess` is what the app estimated; `current`
    is the value to prefill (the app guess on finish, or the stored value on edit).
    Calls cb(minutes). */
/** Ask for duration AND the date the workout happened.
    `dateDefault` prefills the date (the day training actually started).
    Calls cb(minutes, dateISO). */
function askDuration(guess, current, cb, dateDefault){
  const dflt=dateDefault||todayISO();
  modal(`<h2>Nice work — a couple of details</h2>
    <p class="muted">We estimated about <b>${guess}</b> min. If that's off (phone locked, logged later), fix it here.</p>
    <label>Date of this workout</label>
    <input id="wdate" type="date" value="${dflt}" max="${todayISO()}">
    <label style="margin-top:12px">Actual duration (minutes)</label>
    <input id="dur" type="number" inputmode="numeric" min="1" max="600" value="${current}">
    <button class="btn btn-primary btn-block" style="margin-top:16px" data-ok>Save</button>`, m=>{
    m.onclick=e=>{ if(!e.target.closest("[data-ok]")) return;
      const v=clamp(parseInt($("#dur",m).value)||current||guess, 1, 600);
      const d=$("#wdate",m).value || dflt;
      closeModal(); cb(v, d);        // synchronous: cb opens the survey; modal() cancels the pop timer
    };
  });
}
/** The date training actually STARTED = the first logged set's timestamp.
    Falls back to the session's stored date, then today. NOTE: a session object
    is created just by opening the Train tab, so its creation date is NOT a
    reliable "start" — only a logged set proves training began. */
function sessionStartDate(s){
  let earliest=null;
  (s.exercises||[]).forEach(e=>(e.sets||[]).forEach(x=>{
    if(x.done && x.at && (earliest===null || x.at<earliest)) earliest=x.at;
  }));
  if(earliest){
    const d=new Date(earliest);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  return s.date || todayISO();
}

function saveLogEdit(){
  const s=S().editSession;
  const log=S().logs.find(l=>l.id===s.logId);
  if(!log){ S().editSession=null; Store.save(); go("workout"); return; }
  const stored=log.durationMin||1;
  askDuration(stored, stored, (dur, chosenDate)=>{
    const oldDate=log.date;
    if(chosenDate) s.date=chosenDate;
    log.notes=s.notes;
    log.date=s.date;
    log.durationMin=dur;
    // lifting exercises → the log (only those with logged sets)
    log.exercises=s.exercises
      .filter(e=>!e.cardio && e.sets.some(x=>x.done))
      .map(e=>({exerciseId:e.exerciseId, target:e.target, notes:e.notes,
        sets:e.sets.filter(x=>x.done)}));
    // cardio → the cardio store. Remove this workout's old cardio for the date,
    // then re-add whatever cardio cards are present now (auto-capture minutes).
    const editedIds=new Set(s.exercises.filter(e=>e.cardio && e.cardioId).map(e=>e.cardioId));
    S().cardio=S().cardio.filter(c=>{
      // drop the entries we loaded for editing (by id), and any stale ones on the old date for this workout
      if(c.cardioId) return true;
      if(editedIds.has(c.id)) return false;
      if(c.fromWorkout && c.mesoId===log.mesoId && c.date===oldDate) return false;
      return true;
    });
    s.exercises.filter(e=>e.cardio && !e.skipped && (e.done || e.touched) && e.log && e.log.minutes>0).forEach(e=>{
      const ex=exById(e.exerciseId);
      S().cardio.push({id:uid(), date:log.date, type:ex?ex.name:(e._cardioName||"Cardio"),
        minutes:e.log.minutes, avgHR:e.log.avgHR||null, zone:zoneFor(e.log.avgHR),
        distanceKm:e.log.distanceKm||null, level:e.log.level||null, speed:e.log.speed||null, incline:e.log.incline||null,
        notes:e.notes||"", mesoId:log.mesoId, fromWorkout:true});
    });
    S().editSession=null;
    Store.save(); Store.flush();
    toast("Workout updated");
    go("workout");
  }, s.date);
}

/** Re-render a single exercise card + the progress header (no full redraw). */
function refreshCard(xi){
  const s=S().editSession||S().activeSession;
  const holder=$(`[data-card="${xi}"]`);
  if(!holder) return renderWorkout();
  const tmp=document.createElement("div");
  tmp.innerHTML=exCardHTML(s.exercises[xi], xi);
  holder.previousElementSibling.replaceWith(tmp.firstElementChild); // mgtag
  holder.replaceWith(tmp.lastElementChild);                          // card
  const {total,done}=sessionTotals(s);
  const f=$("#pfill"), p=$("#ptext");
  if(f) f.style.width=(total?Math.round(100*done/total):0)+"%";
  if(p) p.textContent=`${done}/${total} sets · ${Math.floor((Date.now()-s.startedAt)/60000)} min`;
}

function bindWorkout(){
  const s=S().editSession||S().activeSession;
  const edit=s.mode==="edit";
  const ro=!!s.readonly;
  const save=()=>Store.save();
  const parse=el=>el.dataset.set.split(":").map(Number);
  if(ro){
    // Read-only: only wire the close/quit control and swipe; no edits.
    enableWorkoutSwipe(s);
    $("#view").onclick=e=>{
      if(e.target.closest('[data-a="quit"]')){
        S().editSession=null; Store.save(); go(S().activeSession?"workout":"calendar");
      }
    };
    return;
  }

  // Inline edits on any set field
  $("#view").oninput=e=>{
    const tin=e.target.closest("[data-tab-in]");
    if(tin){
      const xi=+tin.dataset.tabIn, ses=s.exercises[xi]; if(!ses||!ses.cardio) return;
      ses.target.tabata=ses.target.tabata||{work:20,rest:10,rounds:10};
      const f=tin.dataset.tf, v=clamp(parseInt(tin.value)||0, f==="rest"?0:1, 900);
      ses.target.tabata[f]=v;
      const tb=ses.target.tabata;
      ses.target.minutes=Math.max(1, Math.round(tb.rounds*(tb.work+tb.rest)/60));
      ses.log.minutes=ses.target.minutes;
      save(); return;
    }
    const cel=e.target.closest("[data-card-in]");
    if(cel){
      const xi=+cel.dataset.cardIn, ses=s.exercises[xi]; if(!ses||!ses.cardio) return;
      const f=cel.dataset.cf, v=parseFloat(cel.value);
      if(cel.value==="") ses.log[f]=null;
      else if(isFinite(v)){
        ses.log[f]= (f==="distanceKm"||f==="speed"||f==="incline")? Math.round(v*100)/100 : Math.round(v);
      }
      ses.touched=true;                    // real data entered, not just the prefilled target
      const zc=$(`#cz-${xi}`);
      if(zc){ const z=zoneFor(ses.log.avgHR); zc.dataset.z=z||""; zc.textContent=z?`Zone ${z}`:"Zone —"; }
      save(); return;
    }
    const el=e.target.closest("[data-set]");
    if(!el) return;
    const [xi,si]=parse(el);
    const set=s.exercises[xi]?.sets[si]; if(!set) return;
    if(el.dataset.f==="kg"){
      const v=parseFloat(el.value);
      if(el.value===""){ set.touched=false; set.predReps=undefined; }   // cleared -> back to ghost
      else if(isFinite(v)&&v>=0){
        set.kg=Math.round(toKg(v)*100)/100; set.touched=true;
        // Re-aim the rep target at the weight actually chosen (e.g. only 17.5kg
        // available when 16kg was suggested). null => out of the trusted band,
        // shown as "??" rather than a confident-looking guess.
        const ses=s.exercises[xi], ref=ses.suggestion;
        if(ref && !ses.timed && !ses.bodyweight && ref.lastKg>0){
          const hist=exerciseHistory(ses.exerciseId);
          const work=hist.length? hist[0].sets.filter(x=>x.kg===ref.lastKg && (!x.type||x.type==="normal")):[];
          const base=work.length? work[Math.min(si,work.length-1)].reps : ses.target.reps;
          set.predReps = (set.kg===ref.lastKg)? base+1 : repsAtLoad(ref.lastKg, base, set.kg);
          // only re-aim sets the user hasn't filled in yet
          if(!set.done && !set.touchedReps && set.predReps!==null && set.predReps!==undefined) set.reps=set.predReps;
          repaintPred(xi);
        }
      }
    }
    if(el.dataset.f==="reps"){
      const v=parseInt(el.value);
      if(el.value===""){ set.touched=false; set.touchedReps=false; }
      else if(isFinite(v)){ set.reps=clamp(v,0,100); set.touched=true; set.touchedReps=true; }
    }
    if(el.dataset.f==="secs"){
      const v=parseInt(el.value);
      if(el.value===""){ set.touched=false; }
      else if(isFinite(v)&&v>=0){ set.secs=clamp(v,0,3600); set.touched=true; }
    }
    save();
  };
  $("#view").onchange=e=>{
    const el=e.target.closest("select[data-set]");
    if(!el) return;
    const [xi,si]=parse(el);
    const set=s.exercises[xi]?.sets[si]; if(!set) return;
    if(el.dataset.f==="band"){
      // later sets not yet logged follow the band you just picked
      s.exercises[xi].sets.forEach((r,i)=>{ if(i>=si && (i===si || !r.done)) r.band=el.value; });
      save(); refreshCard(xi); return;
    }
    set.rir=clamp(parseInt(el.value)||0,0,5);
    save();
  };
  // long-press drag removed — reordering is via the ⋯ menu (Move up/down)
  enableWorkoutSwipe(s);

  $("#view").onclick=e=>{
    // Log / unlog a cardio item
    const tt=e.target.closest("[data-tabtog]");
    if(tt){
      const xi=+tt.dataset.tabtog, ses=s.exercises[xi]; if(!ses||!ses.cardio) return;
      ses.target.tabataOn=tt.checked;
      if(tt.checked){
        ses.target.tabata=ses.target.tabata||{work:20,rest:10,rounds:10};
        const tb=ses.target.tabata;
        ses.target.minutes=Math.max(1, Math.round(tb.rounds*(tb.work+tb.rest)/60));
        ses.log.minutes=ses.target.minutes;
      }
      save(); refreshCard(xi); return;
    }
    const cl=e.target.closest("[data-cardiolog]");
    if(cl){
      const xi=+cl.dataset.cardiolog, ses=s.exercises[xi];
      if(!ses.log.minutes || ses.log.minutes<1){ toast("Enter the minutes first"); return; }
      ses.done=!ses.done;
      save(); refreshCard(xi);
      if(ses.done && !edit) maybeCelebrate("cardio", ses);
      return;
    }
    // Log / unlog a set
    const chk=e.target.closest("[data-chk]");
    if(chk){
      const [xi,si]=chk.dataset.chk.split(":").map(Number);
      const ses=s.exercises[xi], set=ses.sets[si];
      set.done=!set.done;
      if(set.done && !edit && FUN() && !isWarm(set)){
        // PR? compare this set's e1RM against all history for the exercise
        try{
          const hist=exerciseHistory(ses.exerciseId);
          const best=hist.length? Math.max(...hist.map(x=>x.e1rm)):0;
          if(best>0 && epley(set.kg,set.reps)>best) maybeCelebrate("pr", ses);
          else if(set.expReps && set.reps>set.expReps) maybeCelebrate("beat", ses);
        }catch(_){}
      }
      set.at=set.done? Date.now():null;
      if(set.done){
        set.touched=true;                                  // logged values render solid
        // carry weight + RIR forward; per-set rep ghosts are prescriptions, leave them
        // ...but never from or into a warm-up: a 40kg warm-up must not drag the
        // 80kg working sets down, and working weight shouldn't overwrite warm-ups.
        if(!isWarm(set)) ses.sets.forEach((r,i)=>{ if(i>si && !r.done && !r.touched && !isWarm(r)){ r.kg=set.kg; r.rir=set.rir; } });
        if(!edit){
          if(!isWarm(set)) checkPR(ses.exerciseId, set.kg, set.reps);
          const remaining=ses.sets.some(r=>!r.done);
          if(remaining) startRest(ses.target.rest);
          else { stopRest(); toast("Exercise done 💪"); try{ duckCheer(ses); }catch(_){} }
        }
      }
      save(); refreshCard(xi);
      return;
    }
    // Per-set menu (tap the row handle): delete or duplicate that set
    const sm=e.target.closest("[data-setmenu]");
    if(sm){
      const [xi,si]=sm.dataset.setmenu.split(":").map(Number);
      const ses=s.exercises[xi], set=ses.sets[si];
      if(!set) return;
      modal(`<h2>Set ${si+1}${set.done?" · logged":""}</h2>
        <p class="muted num">${set.secs!=null?`${set.secs}s hold`:`${dispW(set.kg)}${unitLabel()} × ${set.reps} @${set.rir}RIR`}</p>
        <div class="stack" style="margin-top:12px">
          <button class="btn btn-ghost" data-sa="dup">Duplicate set</button>
          <button class="btn btn-danger" data-sa="del" ${ses.sets.length<=1?"disabled style='opacity:.4'":""}>Delete this set</button>
        </div>
        <div class="kicker" style="margin-top:16px">Set type</div>
        <div class="stack" style="margin-top:8px">
          ${Object.entries(SET_TYPES).map(([k,d])=>`
            <button class="btn btn-ghost settype-opt" data-st="${k}" style="text-align:left;${(set.type||"normal")===k?"border-color:var(--accent);color:var(--accent)":""}">
              <div style="display:flex;align-items:center;gap:8px">
                ${d.badge?`<span class="settype-badge">${d.badge}</span>`:`<span style="width:2px"></span>`}
                <span style="font-weight:800">${d.label}</span>
                ${(set.type||"normal")===k?'<span style="margin-left:auto">✓</span>':""}
              </div>
              <div class="faint" style="margin-top:2px">${d.desc}</div>
            </button>`).join("")}
        </div>`, m=>{
        m.onclick=ev=>{
          const stBtn=ev.target.closest("[data-st]");
          if(stBtn){ const wasWarm=isWarm(set);
            set.type=stBtn.dataset.st==="normal"?null:stBtn.dataset.st;
            if(wasWarm!==isWarm(set)) realignWorkingGhosts(ses);
            save(); closeModal(); refreshCard(xi); return; }
          const sa=ev.target.closest("[data-sa]")?.dataset.sa; if(!sa) return;
          if(sa==="dup"){
            ses.sets.splice(si+1,0,{kg:set.kg, reps:set.reps, rir:set.rir,
              expReps:set.expReps??set.reps, done:false, at:null, type:set.type||null});
          }
          if(sa==="del"){
            if(ses.sets.length<=1) return;
            if(set.done && !confirm("This set is logged — delete it anyway?")) return;
            ses.sets.splice(si,1);
          }
          save(); closeModal(); refreshCard(xi);
        };
      });
      return;
    }
    // Add a set row
    const addset=e.target.closest("[data-addset]");
    if(addset){
      const xi=+addset.dataset.addset, ses=s.exercises[xi];
      const lastRow=ses.sets[ses.sets.length-1];
      ses.sets.push({kg:lastRow?lastRow.kg:0, reps:lastRow?lastRow.reps:ses.target.reps,
        rir:lastRow?lastRow.rir:ses.target.rir,
        expReps:lastRow?(lastRow.expReps??lastRow.reps):ses.target.reps, done:false, at:null});
      save(); refreshCard(xi);
      return;
    }
    // "Can't add weight" -> progress reps at the held weight instead
    const cant=e.target.closest("[data-cantadd]");
    if(cant){ holdWeightRepProgress(+cant.dataset.cantadd); return; }
    const cantD=e.target.closest("[data-cantdrop]");
    if(cantD){ holdWeightRepBackoff(+cantD.dataset.cantdrop); return; }
    const undo=e.target.closest("[data-holdundo]");
    if(undo){ const xi=+undo.dataset.holdundo, ses=s.exercises[xi];
      ses.holdWeight=false;
      // rebuild rows from the original suggestion
      const sug=ses.suggestion;
      if(sug){ ses.sets=buildGhostRows(ses.exerciseId, ses.sets.length, sug.kg, ses.target.reps, ses.target.rir, sug, false); }
      save(); refreshCard(xi); return; }
    // Per-exercise menu
    const menu=e.target.closest("[data-exmenu]");
    if(menu){ exerciseMenu(+menu.dataset.exmenu); return; }

    const a=e.target.closest("[data-a]")?.dataset.a;
    if(a==="addex"){
      pickExercise(exId=>{
        const cardio=isCardioEx(exId);
        let inst, mkSlot;
        if(cardio){
          inst={slotId:null, exerciseId:exId, cardio:true,
            target:{minutes:20, targetHR:null, notes:""},
            notes:"", skipped:false, rowsReady:true, done:false, _edit:edit,
            log:{minutes:20, avgHR:null, distanceKm:null, level:null, speed:null, incline:null}, sets:[]};
          mkSlot=()=>({id:uid(), exerciseId:exId, cardio:true, minutes:20, targetHR:null, notes:""});
        } else if(exById(exId)?.timed){
          const nSets=edit?1:3;
          inst={slotId:null, exerciseId:exId, timed:true,
            target:{sets:nSets, reps:0, rir:2, rest:S().settings.restDefault, notes:"", secs:30},
            suggestion:null, notes:"", skipped:false, rowsReady:true, _edit:edit,
            sets:buildTimedRows(nSets, 30, 2)};
          mkSlot=()=>({id:uid(), exerciseId:exId, sets:3, reps:0, rir:2, secs:30, rest:S().settings.restDefault, notes:""});
        } else {
          const exRef=exById(exId);
          const isBW=repsOnly(exRef);
          // judge it against how the meso programs this lift, if it does (else 10 @ RIR 2)
          const pm=mesoById(s.mesoId||s.bonusOf)||activeMeso();
          const ps=pm && pm.days.flatMap(d=>d.exercises).find(x=>x.exerciseId===exId && !x.cardio && x.reps>0);
          const pReps=ps? ps.reps : 10, pRIR=ps && ps.rir!=null? ps.rir : 2;
          const sug=edit? null : ProgressionEngine.suggest(exId, pReps, pRIR);
          const nSets=edit?1:3;
          const repTarget=(sug && sug.bodyweight)? sug.reps : pReps;
          inst={slotId:null, exerciseId:exId, bodyweight:isBW, band:isBandEx(exRef),
            target:{sets:nSets, reps:repTarget, rir:pRIR, rest:S().settings.restDefault, notes:""},
            suggestion:sug, notes:"", skipped:false, rowsReady:true, _edit:edit,
            sets:buildSetRows(nSets, (isBW?0:(sug?sug.kg:0)), repTarget, pRIR)};
          mkSlot=()=>({id:uid(), exerciseId:exId, sets:3, reps:pReps, rir:pRIR, rest:S().settings.restDefault, notes:""});
        }
        const finish=()=>{ save(); renderWorkout(); toast("Exercise added"); };
        const day=sessionTemplateDay(s);
        if(day){
          scopePrompt(`Add ${exById(exId).name} to this day?`, sc=>{
            if(sc==="future"){ const slot=mkSlot(); day.exercises.push(slot); inst.slotId=slot.id; toast("Added to future workouts too"); }
            s.exercises.push(inst); finish();
          });
        } else { s.exercises.push(inst); finish(); }
      });
      return;
    }
    if(a==="setdate"){ pickWorkoutDate(s); return; }
    if(a==="picker") return workoutPicker();
    if(a==="wmenu") return workoutMenu();
    if(a==="finish") return edit? saveLogEdit() : finishWorkout();
    if(a==="quit"){
      if(edit){
        modal(`<h2>Discard edits?</h2><p class="muted">Changes to this past workout will be thrown away.</p>
          <div class="stack" style="margin-top:14px">
            <button class="btn btn-ghost" data-q="stay">Keep editing</button>
            <button class="btn btn-danger" data-q="drop">Discard edits</button></div>`, m=>{
          m.onclick=ev=>{ const q=ev.target.closest("[data-q]")?.dataset.q; if(!q) return;
            if(q==="drop"){ S().editSession=null; Store.save(); closeModal(); go("workout"); }
            else closeModal(); };
        });
        return;
      }
      if(s.bonus){
        modal(`<h2>Leave bonus workout?</h2><p class="muted">Keep it to resume later, or discard it. ${esc(s.nextName||"Your next workout")} stays next either way.</p>
          <div class="stack" style="margin-top:14px">
            <button class="btn btn-ghost" data-q="keep">Keep &amp; leave</button>
            <button class="btn btn-danger" data-q="discard">Discard bonus</button></div>`, m=>{
          m.onclick=ev=>{ const q=ev.target.closest("[data-q]")?.dataset.q; if(!q) return;
            closeModal(); stopRest();
            if(q==="discard"){ endBonus(); toast("Bonus discarded"); }
            go("home"); };
        });
        return;
      }
      modal(`<h2>Leave workout?</h2><p class="muted">Your logged sets are saved. Resume any time from Home, or leave this one behind.</p>
        <div class="stack" style="margin-top:14px">
          <button class="btn btn-ghost" data-q="keep">Keep &amp; leave</button>
          <button class="btn btn-ghost" data-q="skip">Skip this workout</button>
          <button class="btn btn-danger" data-q="discard">Discard session</button></div>
        <p class="faint" style="margin:10px 0 0">Skipping moves you on to the next workout in the ${term("meso")} — nothing is logged.</p>`, m=>{
        m.onclick=ev=>{ const q=ev.target.closest("[data-q]")?.dataset.q; if(!q) return;
          if(q==="skip"){ closeModal(); confirmSkipWorkout(); return; }
          if(q==="discard"){ S().activeSession=null; Store.save(); Store.flush(); }
          closeModal(); stopRest(); go("home"); };
      });
      return;
    }
    if(a==="wnotes"){
      modal(`<h2>Workout note</h2><p class="muted">Shows on this workout while you train.</p>
        <textarea id="wn" rows="4" placeholder="How's it going, anything to remember…">${esc(s.notes)}</textarea>
        <button class="btn btn-primary btn-block" style="margin-top:14px" data-ok>Save</button>`, m=>{
        m.onclick=ev=>{ if(ev.target.closest("[data-ok]")){ s.notes=$("#wn",m).value.trim(); save(); Store.flush(); closeModal(); renderWorkout(); } };
      });
    }
  };
}

/** Long-press an exercise card header to drag-reorder. Order mutates once on
    drop; scroll position is preserved; a scope prompt offers pushing the new
    order to future workouts (template day). */
function enableCardDrag(s){
  const edit=s.mode==="edit";
  $$(".excard .exhead").forEach(head=>{
    head.addEventListener("pointerdown", e=>{
      if(e.target.closest("button,input,select,textarea")) return;
      const card=head.closest("[data-card]");
      const startY=e.clientY;
      let drag=null;
      const timer=setTimeout(()=>{
        drag={xi:+card.dataset.card};
        card.classList.add("dragging");
        document.body.style.userSelect="none";
      },350);
      const cards=()=>$$("[data-card]");
      const targetAt=y=>{
        for(const c of cards()){
          if(c===card) continue;
          const r=c.getBoundingClientRect();
          if(y<r.bottom) return {c, before:y<r.top+r.height/2};
        }
        const all=cards().filter(c=>c!==card);
        return all.length? {c:all[all.length-1], before:false}:null;
      };
      const startX=e.clientX;
      const move=ev=>{
        if(!drag){
          if(Math.hypot(ev.clientX-startX, ev.clientY-startY)>10){ clearTimeout(timer); cleanup(); }
          return;
        }
        ev.preventDefault();
        cards().forEach(c=>c.classList.remove("drop-before","drop-after"));
        const t=targetAt(ev.clientY);
        if(t) t.c.classList.add(t.before?"drop-before":"drop-after");
      };
      const up=ev=>{
        clearTimeout(timer);
        if(drag){
          const t=targetAt(ev.clientY);
          if(t){
            const from=drag.xi, toXi=+t.c.dataset.card;
            let dest=toXi+(t.before?0:1);
            if(from<dest) dest--;
            if(dest!==from){
              const [item]=s.exercises.splice(from,1);
              s.exercises.splice(clamp(dest,0,s.exercises.length),0,item);
              Store.save();
              const sy=window.scrollY;
              renderWorkout();
              window.scrollTo(0,sy);            // keep the user's place
              const day=sessionTemplateDay(s);
              if(day && !edit){
                scopePrompt("Keep this exercise order?", sc=>{
                  if(sc==="future"){
                    // reorder template slots to match the instance's slot order
                    const order=s.exercises.map(x=>x.slotId).filter(Boolean);
                    day.exercises.sort((a,b)=>{
                      const ia=order.indexOf(a.id), ib=order.indexOf(b.id);
                      return (ia<0?order.length:ia)-(ib<0?order.length:ib);
                    });
                    Store.save(); toast("Future workout order updated");
                  }
                });
              }
            }
          }
        }
        cleanup();
      };
      const cleanup=()=>{
        clearTimeout(timer);
        card.classList.remove("dragging");
        $$("[data-card]").forEach(c=>c.classList.remove("drop-before","drop-after"));
        document.body.style.userSelect="";
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
        window.removeEventListener("pointercancel",cleanup);
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",up);
      window.addEventListener("pointercancel",cleanup);
    });
  });
}

/** Swipe right = previous workout (opens for editing); swipe left = forward
    toward the current workout. Future workouts stay locked. */
function enableWorkoutSwipe(s){
  let tx=null, ty=null;
  $("#view").ontouchstart=e=>{
    if(currentView!=="workout") return;              // swipe is a Train-page gesture only
    if(e.target.closest("input,select,textarea,.setgrid")) return;
    tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  };
  $("#view").ontouchend=e=>{
    if(currentView!=="workout" || s.bonus){ tx=null; return; }
    if(tx==null) return;
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    tx=null;
    if(Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)) return;
    const mesoLogs=S().logs.filter(l=>l.mesoId===s.mesoId && !l.skipped);
    const edit=s.mode==="edit";
    if(dx>0){                                  // swipe right -> previous
      if(edit){
        const i=mesoLogs.findIndex(l=>l.id===s.logId);
        if(i>0) startLogEdit(mesoLogs[i-1].id);
        else toast("This is the first workout");
      } else if(mesoLogs.length) startLogEdit(mesoLogs[mesoLogs.length-1].id);
      else toast("No previous workouts yet");
    } else {                                   // swipe left -> next / peek ahead
      if(edit){
        const i=mesoLogs.findIndex(l=>l.id===s.logId);
        if(i<mesoLogs.length-1) startLogEdit(mesoLogs[i+1].id);
        else { S().editSession=null; Store.save(); go("workout"); }
      } else {
        // From the current workout, swiping forward shows the NEXT planned
        // workout as a read-only preview (projected weights) — not editable.
        const meso=activeMeso(), pos=meso? mesoPosition(meso):null;
        if(meso && pos && !pos.finished){
          const nDays=meso.days.length;
          const nextI=pos.done+1;                 // the one after the current
          if(nextI < pos.total){
            previewDay(meso, nextI%nDays, Math.floor(nextI/nDays)+1);
          } else toast(FUN()?"That's the last one in this plan":"End of mesocycle");
        }
      }
    }
  };
}

/* ---------------- template scope (instance vs future workouts) ----------------
   A workout instance is a snapshot; the mesocycle day is the TEMPLATE for all
   future instances. Instance edits never touch history or the template unless
   the user explicitly applies them to future workouts via these helpers. */
function sessionTemplateDay(s){
  const meso=mesoById(s.mesoId);
  if(!meso) return null;
  return meso.days.find(d=>d.id===s.dayId)||null;
}
/** Ask whether a structural change also applies to future workouts. */
function scopePrompt(what, cb){
  modal(`<h2>Apply this change?</h2><p class="muted">${esc(what)}</p>
    <div class="stack" style="margin-top:14px">
      <button class="btn btn-ghost" data-sc="one">This workout only</button>
      <button class="btn btn-primary" data-sc="future">This + all future workouts</button>
    </div>`, m=>{
    m.onclick=e=>{ const sc=e.target.closest("[data-sc]")?.dataset.sc; if(!sc) return;
      closeModal(); cb(sc); };
  });
}

    <button class="btn btn-ghost" data-m="replace">Replace exercise</button>

      <label style="text-transform:none;margin:0;font-size:15px">Rest time (seconds)</label>

    <button class="btn btn-danger" data-m="remove">Remove from workout</button></div>`, m=>{

    if(restIn){
      restIn.onchange=()=>{
        const secs=clamp(parseInt(restIn.value)||0,0,900);

        ses.target.rest=secs; Store.save();
        const day=sessionTemplateDay(s);

        if(slot && !edit){
          closeModal();
